    <meta charset="UTF-8" />

    <title>منصة كفاءة لإدارة التسويق الإلكتروني للجمعيات</title>
    <meta name="description" content="منصة كفاءة: منصة موحدة لإدارة التسويق الإلكتروني للجمعيات، متابعة المتبرعين، وقياس الأداء بكفاءة عالية.">
    <meta name="author" content="منصة كفاءة" />

    <script>
      // Pre-hydrate org branding BEFORE React mounts to eliminate any
      // flash of the default theme on first paint when navigating into
      // an organization-scoped route (e.g. /atff/...).
      //
      // Strategy:
      //   1) Resolve the org slug from the URL.
      //   2) Apply slug-keyed cache synchronously if present.
      //   3) Otherwise gate first paint and fetch branding from REST.
      //      The UI is revealed ONLY after real org branding is applied.
      //      This avoids published-site flicker on empty cache / slow networks.
      (function () {
        var SUPABASE_URL = "https://jopvcsrmccoulujeyjvw.supabase.co";
        var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvcHZjc3JtY2NvdWx1amV5anZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjU1MjAsImV4cCI6MjA5MjIwMTUyMH0.s3R2dRBKi_S7iS4y5CjAe-hr6hYJwivOSNNeekqC2wE";

        function hexToHsl(hex) {
          var m = /^#?([0-9a-f]{6})$/i.exec((hex || "").trim());
          if (!m) return null;
          var n = parseInt(m[1], 16);
          var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, bl = (n & 255) / 255;
          var mx = Math.max(r, g, bl), mn = Math.min(r, g, bl);
          var h = 0, s = 0, l = (mx + mn) / 2;
          if (mx !== mn) {
            var d = mx - mn;
            s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
            if (mx === r) h = ((g - bl) / d + (g < bl ? 6 : 0));
            else if (mx === g) h = ((bl - r) / d + 2);
            else h = ((r - g) / d + 4);
            h *= 60;
          }
          return Math.round(h) + " " + Math.round(s * 100) + "% " + Math.round(l * 100) + "%";
        }

        function applyBranding(b) {
          if (!b) return false;
          var root = document.documentElement;
          var p = hexToHsl(b.primary), a = hexToHsl(b.accent), s2 = hexToHsl(b.secondary);
          if (p) {
            root.style.setProperty("--primary", p);
            root.style.setProperty("--sidebar-primary", p);
            root.style.setProperty("--ring", p);
            root.style.setProperty("--sidebar-ring", p);
            root.style.setProperty("--gradient-primary", "linear-gradient(135deg, hsl(" + p + ") 0%, hsl(" + p + " / 0.85) 100%)");
          }
          if (a) {
            root.style.setProperty("--accent", a);
            root.style.setProperty("--gradient-accent", "linear-gradient(135deg, hsl(" + a + ") 0%, hsl(" + a + " / 0.85) 100%)");
          }
          if (s2) root.style.setProperty("--secondary", s2);
          if (p || a) root.setAttribute("data-org-branded", "true");
          // Preload the org logo as soon as branding resolves so the
          // header <img> can paint instantly from the HTTP cache when
          // React mounts (no flash, no layout gap on logo swap).
          if (b.logoUrl) {
            try {
              var existing = document.querySelector(
                'link[rel="preload"][as="image"][data-branding-logo="true"]'
              );
              if (!existing || existing.getAttribute("href") !== b.logoUrl) {
                if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "image";
                link.href = b.logoUrl;
                link.setAttribute("data-branding-logo", "true");
                link.setAttribute("fetchpriority", "high");
                document.head.appendChild(link);
              }
              // Also kick off an Image() fetch so the browser starts
              // decoding the bitmap immediately, even on browsers that
              // ignore <link rel="preload" as="image">.
              var img = new Image();
              img.decoding = "async";
              img.src = b.logoUrl;
            } catch (e) { /* noop */ }
          }
          return !!(p || a);
        }

        try {
          var path = window.location.pathname || "";
          var search = window.location.search || "";
          var seg = path.split("/").filter(Boolean);
          var slug = null;
          if (seg[0] === "demo") return;
          var qs = new URLSearchParams(search).get("org");
          if (qs) slug = qs;
          else if (seg[0] === "admin" && seg.length >= 3 && /^orgs?$|^organizations?$/.test(seg[1])) slug = seg[2];
          else if (seg[0] && seg[0] !== "admin") slug = seg[0];

          var hasAppliedBranding = false;

          // 1) Try slug-keyed cache FIRST (synchronous, no flash).
          var rawSlug = slug ? localStorage.getItem("org_branding_slug_v1:" + slug) : null;
          var cachedVersion = null;
          if (rawSlug) {
            var parsedCache = JSON.parse(rawSlug);
            hasAppliedBranding = applyBranding(parsedCache) || hasAppliedBranding;
            cachedVersion = hasAppliedBranding && parsedCache && parsedCache.updatedAt ? parsedCache.updatedAt : null;
            // Continue to background-revalidate against the API so stale
            // colors/logos are updated automatically (versioned by updated_at).
          }

          // ONLY gate the very first paint when we have ZERO cached branding
          // for this slug — otherwise the cached values already painted the
          // correct colors and any further hide/show would cause the page
          // content to "shake" (the exact flicker users are reporting under
          // the header). With cache present, we never gate and never repaint
          // until the API confirms a version mismatch.
          if (slug && !hasAppliedBranding) {
            var styleEl = document.createElement("style");
            styleEl.id = "__branding_gate__";
            styleEl.textContent = "body{visibility:hidden!important}";
            document.head.appendChild(styleEl);
          }

          // 2) If we have a slug and no valid slug-cache, fetch from REST API
          //    while the body is blocked so the user never sees wrong colors.
          if (!slug) return;

          var revealed = false;
          function reveal() {
            if (revealed) return;
            revealed = true;
            var el = document.getElementById("__branding_gate__");
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }
          // If we already painted from cache, mark as revealed so the API
          // response never re-triggers any visibility change.
          if (hasAppliedBranding) revealed = true;
          var timeoutId = setTimeout(function () {
            // Never let the pre-paint branding gate trap the app on a blank
            // screen. If branding cannot be resolved quickly, show the app
            // with the default theme and let React continue normally.
            reveal();
          }, 4000);

          // Fetch organization_profiles via REST joined with organizations(slug).
          var url = SUPABASE_URL + "/rest/v1/organizations?slug=eq."
            + encodeURIComponent(slug)
            + "&select=id,logo_url,updated_at,organization_profiles(primary_color,secondary_color,accent_color,logo_url,updated_at)&limit=1";
          fetch(url, {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
            },
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (rows) {
              if (!rows || !rows.length) {
                reveal();
                return;
              }
              var row = rows[0];
              var prof = row.organization_profiles || {};
              if (Array.isArray(prof)) prof = prof[0] || {};
              var version = (prof && prof.updated_at) || row.updated_at || null;
              // If the cached version matches what's in the DB, do nothing —
              // colors are already on screen and there's no need to repaint.
              if (cachedVersion && version && cachedVersion === version) return;
              var b = {
                logoUrl: prof.logo_url || row.logo_url || null,
                primary: prof.primary_color || null,
                secondary: prof.secondary_color || null,
                accent: prof.accent_color || null,
                updatedAt: version,
              };
              hasAppliedBranding = applyBranding(b) || hasAppliedBranding;
              try {
                localStorage.setItem("org_branding_slug_v1:" + slug, JSON.stringify(b));
                if (row.id) {
                  localStorage.setItem("org_branding_v1:" + row.id, JSON.stringify(b));
                  localStorage.setItem("active_organization_id", row.id);
                }
              } catch (e) { /* noop */ }
            })
            .catch(function () { /* noop */ })
            .finally(function () {
              clearTimeout(timeoutId);
              reveal();
            });
        } catch (e) {
          var el = document.getElementById("__branding_gate__");
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
      })();
    </script>
