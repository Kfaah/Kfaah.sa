name: Kfaah Secret Capability Audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.user.login == 'gaberalhrese-cloud' &&
      github.event.comment.body == 'KFAAH_SECRET_CAP_AUDIT'
    runs-on: ubuntu-latest
    steps:
      - name: Check capability presence only
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DB_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          {
            echo "SUPABASE_SERVICE_ROLE_KEY=$([ -n "${SERVICE_ROLE:-}" ] && echo SET || echo MISSING)"
            echo "VITE_SUPABASE_ANON_KEY=$([ -n "${ANON_KEY:-}" ] && echo SET || echo MISSING)"
            echo "DATABASE_URL=$([ -n "${DB_URL:-}" ] && echo SET || echo MISSING)"
            echo "POSTGRES_PASSWORD=$([ -n "${POSTGRES_PASSWORD:-}" ] && echo SET || echo MISSING)"
          } > /tmp/cap.txt
      - name: Post result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'KFAAH_SECRET_CAP_AUDIT_REPORT'; echo; cat /tmp/cap.txt; } > /tmp/comment.txt
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.txt
