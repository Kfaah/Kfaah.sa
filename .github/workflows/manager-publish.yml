name: Kfaah Manager Publish

run-name: Kfaah manager publish ${{ inputs.command_id }}

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Manager command id"
        required: true
        type: string
      payload_token:
        description: "Signed reviewed payload token"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kfaah-frontend-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kfaah.sa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KFAAH_DEPLOY_TARGET: production
      KFAAH_EXPECTED_API_URL: https://kfaah.sa
      MANAGER_URL: https://kfaah-manager.floot.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remember reviewed base
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download exact reviewed edits
        env:
          COMMAND_ID: ${{ inputs.command_id }}
          PAYLOAD_TOKEN: ${{ inputs.payload_token }}
        run: |
          set -euo pipefail
          curl -fsS --get \
            --data-urlencode "commandId=$COMMAND_ID" \
            --data-urlencode "token=$PAYLOAD_TOKEN" \
            "$MANAGER_URL/_api/publish-payload" -o /tmp/kfaah-reviewed.json
          test -s /tmp/kfaah-reviewed.json

      - name: Apply reviewed edits
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const payload = JSON.parse(fs.readFileSync("/tmp/kfaah-reviewed.json", "utf8"));
          if (!Array.isArray(payload.edits) || payload.edits.length === 0) throw new Error("No reviewed edits");
          const allowed = (p) => p === "index.html" || p === "vite.config.ts" || p.startsWith("src/") || p.startsWith("public/");
          for (const edit of payload.edits) {
            if (!edit || typeof edit.path !== "string" || !allowed(edit.path)) throw new Error("Protected path: " + String(edit?.path));
            const target = path.resolve(process.cwd(), edit.path);
            if (!target.startsWith(process.cwd() + path.sep)) throw new Error("Unsafe path");
            if (edit.old === null) {
              if (fs.existsSync(target)) throw new Error("New file already exists: " + edit.path);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.writeFileSync(target, String(edit.new), "utf8");
              continue;
            }
            const current = fs.readFileSync(target, "utf8");
            const oldText = String(edit.old);
            const first = current.indexOf(oldText);
            const last = current.lastIndexOf(oldText);
            if (first < 0 || first !== last) throw new Error("Reviewed text is not unique in " + edit.path);
            const next = current.slice(0, first) + String(edit.new) + current.slice(first + oldText.length);
            fs.writeFileSync(target, next, "utf8");
          }
          NODE
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Rebuild reviewed frontend
        run: bash deploy/build-frontend.sh

      - name: Upload exact reviewed build to staging
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          rsync -az --delete --delay-updates -e "ssh -i $HOME/.ssh/id_kfaah_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" dist/ "$HETZNER_USER@$HETZNER_HOST:/home/deploy/incoming/"
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'sudo /usr/local/bin/kfaah-receive-frontend /home/deploy/incoming'

      - name: Commit reviewed source to main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo "main changed after preview; run the manager command again" >&2; exit 1; }
          git config user.name "Kfaah Manager"
          git config user.email "manager@kfaah.local"
          git add -- index.html vite.config.ts src public 2>/dev/null || true
          git diff --cached --quiet && { echo "No source changes to publish" >&2; exit 1; }
          git commit -m "Kfaah manager command #${{ inputs.command_id }}"
          git push origin HEAD:main
          echo "REVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh fast preview baseline
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete --exclude '.git/' --exclude 'node_modules/' --exclude 'vite.fast.config.ts' --exclude '.env.local' -e "ssh -i $HOME/.ssh/id_kfaah_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" ./ "$HETZNER_USER@$HETZNER_HOST:/home/deploy/kfaah-fast/baseline/"

      - name: Promote staging to live and verify
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'sudo /usr/local/bin/kfaah-promote-frontend --live'
          curl -fsS --retry 6 --retry-delay 5 https://kfaah.sa/ -o /tmp/kfaah-home.html
          test -s /tmp/kfaah-home.html
          echo "LIVE_OK https://kfaah.sa sha=$REVIEW_SHA"

      - name: Sync fast preview workspace
        if: ${{ success() }}
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete --exclude node_modules --exclude .git --exclude .env.local -e "ssh -i $HOME/.ssh/id_kfaah_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" ./ "$HETZNER_USER@$HETZNER_HOST:/home/deploy/kfaah-fast/workspace/"
