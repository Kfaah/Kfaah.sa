name: Kfaah receive source review

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: kfaah-source-review-channel
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'gaberalhrese-cloud/shop-soulmate-04' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '253139283' &&
      github.event.issue.user.id == 253139283 &&
      github.event.issue.title == 'KFAAH_SOURCE_REVIEW_V1' &&
      !github.event.issue.pull_request &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable event request without executing its text
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          def require(value):
              if not value:
                  raise SystemExit('REQUEST_REJECTED')
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
              event = json.load(stream)
          issue = event.get('issue', {})
          require(os.environ['GITHUB_EVENT_NAME'] == 'issues' and event.get('action') == 'opened')
          require(os.environ['GITHUB_REPOSITORY'] == 'gaberalhrese-cloud/shop-soulmate-04')
          require(os.environ['GITHUB_REF'] == 'refs/heads/main' and os.environ['GITHUB_RUN_ATTEMPT'] == '1')
          require(os.environ['GITHUB_ACTOR_ID'] == '253139283')
          require(event.get('sender', {}).get('id') == 253139283)
          require(event.get('repository', {}).get('owner', {}).get('id') == 253139283)
          require(issue.get('user', {}).get('id') == 253139283 and issue.get('author_association') == 'OWNER')
          require(issue.get('title') == 'KFAAH_SOURCE_REVIEW_V1' and 'pull_request' not in issue)
          require(type(issue.get('number')) is int and issue['number'] > 0)
          body = issue.get('body')
          require(type(body) is str and len(body.encode('utf-8')) <= 4096)
          try:
              request = json.loads(body, object_pairs_hook=unique)
          except (ValueError, TypeError):
              raise SystemExit('REQUEST_REJECTED')
          require(type(request) is dict and set(request) == {
              'version', 'operation', 'workflow_sha', 'expected_receive_sha256'})
          require(type(request['version']) is int and request['version'] == 1)
          require(request['operation'] == 'SOURCE_REVIEW')
          require(type(request['workflow_sha']) is str and re.fullmatch('[0-9a-f]{40}', request['workflow_sha']))
          require(request['workflow_sha'] == os.environ['EXPECTED_WORKFLOW_SHA'])
          require(request['expected_receive_sha256'] == '5494cae6b5ae590f1528da9a3f48da5e0f0e978e013b0d9d161d4c99ff09c6c4')
          print('SOURCE_REVIEW_REQUEST_ACCEPTED issue='+str(issue['number']))
          PY
      - name: Read fixed receive helper as redacted lexical structure only
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy
          [[ "$HETZNER_HOST" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9])$ ]]
          : "${HETZNER_SSH_KEY:?Missing existing deploy key}"
          : "${HETZNER_KNOWN_HOSTS:?Missing existing pinned host keys}"
          key_dir="$(mktemp -d "$RUNNER_TEMP/kfaah-owner-audit.XXXXXX")"
          trap 'rm -rf -- "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          /usr/bin/ssh -F /dev/null -i "$key_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "deploy@$HETZNER_HOST" '/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -' <<'PY'
          import re, shlex

          COMMANDS = frozenset('set test printf echo exit mkdir rsync find chmod chown install stat readlink realpath flock cp mv rm ln touch id'.split())
          KEYWORDS = frozenset('if then else elif fi for in do done case esac function'.split())
          PATHS = frozenset(('/home/deploy/incoming', '/home/deploy/incoming/', '/var/www/kfaah-staging', '/var/www/kfaah-staging/', '/var/www/kfaah-releases', '/var/www/kfaah-current', '/run/lock/kfaah-promote-frontend.lock', '/usr/bin/rsync', '/bin/bash', '/usr/bin/bash', '/usr/bin/env'))
          FLAGS = frozenset(('-a', '-az', '-r', '-R', '-rf', '-p', '-f', '-n', '-e', '-d', '-L', '-z', '-u', '-o', '-euo', 'pipefail', '--delete', '--checksum', '--delay-updates', '--chown=www-data:www-data', '--', '-type', '-name', '-path', '-exec', '-print', '-print0', '-maxdepth', '-mindepth', '-c', '-eq', '-ne', '!=', '=', '=='))
          CONSTANTS = frozenset(('0', '1', '0700', '0755', '0644', '700', '755', '644', 'root:root', 'www-data:www-data', 'f', 'd', 'l', '{}'))
          REFS = frozenset(('$1', '$src', '$SRC', '${src}', '${SRC}', '$src/', '$SRC/', '${src}/', '${SRC}/'))
          ASSIGN_NAMES = frozenset(('src', 'SRC'))
          OPERATORS = frozenset((';', '&&', '||', '[', ']', '[[', ']]', '!', '(', ')', '{', '}'))

          def render(source):
              output = ['FORMAT=REDACTED_STRUCTURE_V1', 'SOURCE_CONTENT=NOT_EXPORTED']
              gaps = 0
              if source.startswith(b'#!/bin/bash\n') or source.startswith(b'#!/usr/bin/bash\n') or source.startswith(b'#!/usr/bin/env bash\n'):
                  output.append('LANGUAGE=SUPPORTED_BASH_SUBSET')
              elif source.startswith(b'#!/bin/sh\n'):
                  output.append('LANGUAGE=SUPPORTED_SH_SUBSET')
              else:
                  return output + ['LANGUAGE=UNSUPPORTED', 'GAPS=ALL_SOURCE_HIDDEN']
              try:
                  text = source.decode('utf-8', errors='strict')
              except UnicodeError:
                  return output + ['ENCODING=UNSUPPORTED', 'GAPS=ALL_SOURCE_HIDDEN']
              opaque_tail = False
              for number, line in enumerate(text.splitlines(), 1):
                  if number > 400:
                      gaps += 1
                      output.append('OUTPUT_LIMIT=REMAINDER_HIDDEN')
                      break
                  if number == 1 or not line.strip() or line.lstrip().startswith('#'):
                      continue
                  if opaque_tail:
                      gaps += 1
                      output.append('LINE='+str(number)+' GAP=OPAQUE_TAIL')
                      continue
                  if '<<' in line:
                      # A heredoc can contain arbitrary code-looking secrets. Do not guess its delimiter.
                      opaque_tail = True
                      gaps += 1
                      output.append('LINE='+str(number)+' GAP=HEREDOC_AND_REMAINDER_HIDDEN')
                      continue
                  if line.rstrip().endswith('\\') or '$(' in line or '`' in line or '<(' in line or '>(' in line:
                      # Multiline strings/substitutions can invalidate all following line boundaries.
                      opaque_tail = True
                      gaps += 1
                      output.append('LINE='+str(number)+' GAP=MULTILINE_OR_SUBSTITUTION_AND_REMAINDER_HIDDEN')
                      continue
                  try:
                      lexer = shlex.shlex(line, posix=True, punctuation_chars=';&|()<>')
                      lexer.whitespace_split = True
                      lexer.commenters = '#'
                      words = list(lexer)
                  except ValueError:
                      opaque_tail = True
                      gaps += 1
                      output.append('LINE='+str(number)+' GAP=UNPARSED_AND_REMAINDER_HIDDEN')
                      continue
                  if len(words) > 128 or any(len(word) > 2048 for word in words):
                      gaps += 1
                      output.append('LINE='+str(number)+' GAP=TOKEN_LIMIT')
                      continue
                  visible = []
                  hidden = 0
                  for word in words:
                      if word in COMMANDS:
                          visible.append('KNOWN_COMMAND:'+word)
                      elif word in KEYWORDS:
                          visible.append('KEYWORD:'+word)
                      elif word in PATHS:
                          visible.append('FIXED_PATH:'+word)
                      elif word in FLAGS:
                          visible.append('KNOWN_OPTION:'+word)
                      elif word in CONSTANTS:
                          visible.append('KNOWN_CONSTANT:'+word)
                      elif word in REFS:
                          visible.append('ALLOWED_REFERENCE:'+word)
                      elif word in OPERATORS:
                          visible.append('KNOWN_OPERATOR:'+word)
                      else:
                          assignment = re.fullmatch(r'(src|SRC)=(.*)', word)
                          if assignment and assignment[1] in ASSIGN_NAMES:
                              value = assignment[2]
                              if value in REFS:
                                  visible.append('INPUT_ASSIGNMENT:'+assignment[1]+'='+value)
                              elif value in PATHS:
                                  visible.append('FIXED_ASSIGNMENT:'+assignment[1]+'='+value)
                              else:
                                  visible.append('REDACTED_ASSIGNMENT')
                                  hidden += 1
                          else:
                              visible.append('REDACTED_TOKEN')
                              hidden += 1
                  if hidden:
                      gaps += 1
                  output.append('LINE='+str(number)+' TOKENS='+' '.join(visible)+' GAP='+str(bool(hidden)).lower())
              output.append('GAP_LINES='+str(gaps))
              output.append('SEMANTIC_COMPLETENESS=NOT_ESTABLISHED')
              output.append('KNOWN_TOKENS_ARE_LEXICAL_NOT_PROOF_OF_COMMAND_EXECUTION')
              return output

          import hashlib, os, pwd, stat
          if os.geteuid() != 1000 or pwd.getpwuid(os.geteuid()).pw_name != 'deploy':
              raise SystemExit('UNEXPECTED_DEPLOY_IDENTITY')
          directory = handle = None
          try:
              directory = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              for part in ('usr', 'local', 'bin'):
                  child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=directory)
                  os.close(directory)
                  directory = child
                  info = os.fstat(directory)
                  if info.st_uid != 0 or info.st_mode & 0o022:
                      raise ValueError('untrusted ancestor')
              handle = os.open('kfaah-receive-frontend', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
              before = os.fstat(handle)
              if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_nlink != 1 or before.st_mode & 0o7022 or before.st_size > 2*1024*1024:
                  raise ValueError('untrusted helper')
              data = bytearray()
              while len(data) <= 2*1024*1024:
                  chunk = os.read(handle, 65536)
                  if not chunk:
                      break
                  data.extend(chunk)
              after = os.fstat(handle)
              fields = ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns', 'st_nlink', 'st_uid', 'st_mode')
              if len(data) != before.st_size or len(data) > 2*1024*1024 or any(getattr(before, name) != getattr(after, name) for name in fields):
                  raise ValueError('helper changed')
              digest = hashlib.sha256(data).hexdigest()
              if digest != '5494cae6b5ae590f1528da9a3f48da5e0f0e978e013b0d9d161d4c99ff09c6c4':
                  raise ValueError('unexpected helper identity')
          except (OSError, ValueError):
              raise SystemExit('SOURCE_REVIEW_READ_OR_IDENTITY_NOT_CONFIRMED')
          finally:
              if handle is not None:
                  os.close(handle)
              if directory is not None:
                  os.close(directory)
          print('RECEIVE_SHA256='+digest)
          for safe_line in render(bytes(data)):
              print(safe_line)
          PY
