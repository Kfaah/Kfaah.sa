name: Deploy Kfaah frontend to Hetzner

on:
  workflow_dispatch:
    inputs:
      promote_live:
        description: "Promote the reviewed staging build to live"
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kfaah-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 5 &&
       github.event.comment.user.login == 'gaberalhrese-cloud' &&
       (startsWith(github.event.comment.body, 'KFAAH_PREVIEW ') ||
        startsWith(github.event.comment.body, 'KFAAH_PUBLISH ')))
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kfaah.sa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KFAAH_DEPLOY_TARGET: production
      KFAAH_EXPECTED_API_URL: https://kfaah.sa
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve reviewed source for chat request
        id: request
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_BODY" =~ ^KFAAH_(PREVIEW|PUBLISH)[[:space:]]([0-9a-f]{40})$ ]]; then
            mode="${BASH_REMATCH[1],,}"
            source_sha="${BASH_REMATCH[2]}"
          else
            echo "Invalid deployment request" >&2
            exit 1
          fi
          git fetch origin main
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main
          if [[ "$mode" == publish ]]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/5/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
              | grep -Fx "KFAAH_PREVIEW_OK $source_sha"
          fi
          git switch --detach "$source_sha"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build frontend for kfaah.sa
        run: bash deploy/build-frontend.sh
      - name: Capture login screen preview
        if: ${{ steps.request.outputs.mode == 'preview' }}
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.1 install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > /tmp/kfaah-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ -o /dev/null
          npx --yes playwright@1.55.1 screenshot \
            --viewport-size='1440,900' \
            --wait-for-timeout=5000 \
            http://127.0.0.1:4173/ preview-login.png
          test -s preview-login.png
      - name: Save login screen preview
        if: ${{ steps.request.outputs.mode == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: kfaah-login-preview-${{ github.run_id }}
          path: preview-login.png
          retention-days: 7
      - name: Upload dist to staging
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HETZNER_HOST:?Set HETZNER_HOST}"
          : "${HETZNER_USER:?Set HETZNER_USER}"
          : "${HETZNER_SSH_KEY:?Set HETZNER_SSH_KEY}"
          : "${HETZNER_KNOWN_HOSTS:?Set HETZNER_KNOWN_HOSTS}"
          test "$HETZNER_USER" = deploy
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          rsync -az --delete --delay-updates -e "ssh -i $HOME/.ssh/id_kfaah_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" dist/ "$HETZNER_USER@$HETZNER_HOST:/home/deploy/incoming/"
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'sudo /usr/local/bin/kfaah-receive-frontend /home/deploy/incoming'
      - name: Record successful preview
        if: ${{ steps.request.outputs.mode == 'preview' }}
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: gh issue comment 5 --body "KFAAH_PREVIEW_OK $SOURCE_SHA"
      - name: Promote reviewed staging to live
        if: ${{ inputs.promote_live || steps.request.outputs.mode == 'publish' }}
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'sudo /usr/local/bin/kfaah-promote-frontend --live'
          curl -fsS --retry 6 --retry-delay 5 https://kfaah.sa/ -o /tmp/kfaah-home.html
          test -s /tmp/kfaah-home.html
          echo "LIVE_OK https://kfaah.sa"
      - name: Record successful publish
        if: ${{ steps.request.outputs.mode == 'publish' }}
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: gh issue comment 5 --body "KFAAH_PUBLISH_OK $SOURCE_SHA"
