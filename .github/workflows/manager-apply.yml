name: Kfaah Manager Apply

run-name: Kfaah manager command ${{ inputs.command_id }}

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Manager command id"
        required: true
        type: string
      branch:
        description: "Temporary review branch"
        required: true
        type: string
      changes_base64:
        description: "Base64 encoded deterministic edit operations"
        required: true
        type: string
      preview_path:
        description: "Route to capture for internal review"
        required: true
        default: "/"
        type: string
      preview_callback_token:
        description: "One-way callback token for preview storage"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kfaah-manager-${{ inputs.command_id }}
  cancel-in-progress: false

jobs:
  apply-build-stage:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kfaah.sa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KFAAH_DEPLOY_TARGET: production
      KFAAH_EXPECTED_API_URL: https://kfaah.sa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create review branch and apply deterministic edits
        env:
          REVIEW_BRANCH: ${{ inputs.branch }}
          CHANGES_BASE64: ${{ inputs.changes_base64 }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C "$REVIEW_BRANCH" origin/main
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path

          payload = json.loads(base64.b64decode(os.environ["CHANGES_BASE64"]).decode("utf-8"))
          edits = payload.get("edits") or []
          if not edits:
              raise SystemExit("No edits supplied")

          protected = (".github/", "deploy/", "supabase/", ".env", "package.json", "package-lock.json")
          allowed_prefixes = ("src/", "public/")

          for edit in edits:
              path = str(edit.get("path") or "")
              old = edit.get("old")
              new = edit.get("new")
              if not path or new is None:
                  raise SystemExit("Invalid edit")
              if path in ("index.html", "vite.config.ts"):
                  pass
              elif not path.startswith(allowed_prefixes):
                  raise SystemExit(f"Path not allowed: {path}")
              if path.startswith(protected) or path in protected:
                  raise SystemExit(f"Protected path: {path}")

              target = Path(path)
              if old is None:
                  if target.exists():
                      raise SystemExit(f"Create target already exists: {path}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(str(new), encoding="utf-8")
                  continue

              if not target.exists():
                  raise SystemExit(f"Target missing: {path}")
              text = target.read_text(encoding="utf-8")
              old = str(old)
              if not old or text.count(old) != 1:
                  raise SystemExit(f"Expected exact old text once in {path}, found {text.count(old)}")
              target.write_text(text.replace(old, str(new), 1), encoding="utf-8")
          PY
          git diff --check
          test -n "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build reviewed frontend
        run: bash deploy/build-frontend.sh

      - name: Capture internal preview
        env:
          PREVIEW_PATH: ${{ inputs.preview_path }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_PATH" =~ ^/[A-Za-z0-9_./?=&%+-]*$ ]] || { echo "Invalid preview path" >&2; exit 1; }
          npx --yes playwright@1.55.1 install --with-deps chromium
          npm run preview -- --host 127.0.0.1 > /tmp/kfaah-vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ -o /dev/null
          npx --yes playwright@1.55.1 screenshot --full-page --viewport-size='1440,900' --wait-for-timeout=3500 "http://127.0.0.1:4173$PREVIEW_PATH" internal-preview-desktop.png
          npx --yes playwright@1.55.1 screenshot --full-page --viewport-size='390,844' --wait-for-timeout=3500 "http://127.0.0.1:4173$PREVIEW_PATH" internal-preview-mobile.png
          test -s internal-preview-desktop.png
          test -s internal-preview-mobile.png

      - name: Upload internal preview into Kfaah Manager
        env:
          COMMAND_ID: ${{ inputs.command_id }}
          PREVIEW_PATH: ${{ inputs.preview_path }}
          PREVIEW_CALLBACK_TOKEN: ${{ inputs.preview_callback_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PREVIEW_CALLBACK_TOKEN"
          desktop_size="$(stat -c%s internal-preview-desktop.png)"
          mobile_size="$(stat -c%s internal-preview-mobile.png)"
          target_payload="$(jq -n             --arg commandId "$COMMAND_ID"             --arg token "$PREVIEW_CALLBACK_TOKEN"             --arg previewPath "$PREVIEW_PATH"             --argjson desktopSize "$desktop_size"             --argjson mobileSize "$mobile_size"             '{commandId:$commandId,token:$token,previewPath:$previewPath,desktopSize:$desktopSize,mobileSize:$mobileSize}')"
          target_response="$(curl --fail-with-body -sS             -H 'Content-Type: application/json'             -d "$target_payload"             https://kfaah-manager.floot.app/_api/preview-upload-target)"
          desktop_url="$(printf '%s' "$target_response" | jq -r '.desktopPresignedUrl')"
          mobile_url="$(printf '%s' "$target_response" | jq -r '.mobilePresignedUrl')"
          test -n "$desktop_url"
          test -n "$mobile_url"
          curl -fsS -X PUT -H 'Content-Type: image/png' --data-binary @internal-preview-desktop.png "$desktop_url"
          curl -fsS -X PUT -H 'Content-Type: image/png' --data-binary @internal-preview-mobile.png "$mobile_url"

      - name: Save internal preview backup
        uses: actions/upload-artifact@v4
        with:
          name: kfaah-internal-preview-${{ github.run_id }}
          path: |
            internal-preview-desktop.png
            internal-preview-mobile.png
          retention-days: 7

      - name: Commit reviewed source
        env:
          REVIEW_BRANCH: ${{ inputs.branch }}
          COMMAND_ID: ${{ inputs.command_id }}
        run: |
          set -euo pipefail
          git config user.name "Kfaah Manager"
          git config user.email "manager@kfaah.local"
          git add -A
          git diff --cached --quiet && { echo "Edits produced no source changes" >&2; exit 1; }
          git commit -m "Kfaah manager command #$COMMAND_ID"
          git push --force-with-lease origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "REVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload reviewed build to Hetzner staging
        env:
          REVIEW_BRANCH: ${{ inputs.branch }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HETZNER_HOST:?Set HETZNER_HOST}"
          : "${HETZNER_USER:?Set HETZNER_USER}"
          : "${HETZNER_SSH_KEY:?Set HETZNER_SSH_KEY}"
          : "${HETZNER_KNOWN_HOSTS:?Set HETZNER_KNOWN_HOSTS}"
          test "$HETZNER_USER" = deploy
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          rsync -az --delete --delay-updates -e "ssh -i $HOME/.ssh/id_kfaah_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" dist/ "$HETZNER_USER@$HETZNER_HOST:/home/deploy/incoming/"
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'sudo /usr/local/bin/kfaah-receive-frontend /home/deploy/incoming'
          echo "STAGING_OK branch=$REVIEW_BRANCH sha=$REVIEW_SHA"

      - name: Mark internal preview ready
        env:
          COMMAND_ID: ${{ inputs.command_id }}
          PREVIEW_CALLBACK_TOKEN: ${{ inputs.preview_callback_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PREVIEW_CALLBACK_TOKEN"
          payload="$(jq -n --arg commandId "$COMMAND_ID" --arg token "$PREVIEW_CALLBACK_TOKEN" '{commandId:$commandId,token:$token}')"
          curl --fail-with-body -sS             -H 'Content-Type: application/json'             -d "$payload"             https://kfaah-manager.floot.app/_api/preview-upload-complete
