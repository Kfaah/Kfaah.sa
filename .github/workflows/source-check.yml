name: Kfaah source check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kfaah.sa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KFAAH_DEPLOY_TARGET: production
      KFAAH_EXPECTED_API_URL: https://kfaah.sa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: bash deploy/build-frontend.sh
      - name: Validate recovery shell scripts
        run: |
          set -euo pipefail
          bash -n deploy/recovery/kfaah_backend_recovery.sh
          bash -n deploy/recovery/install_limited_recovery_sudo.sh
          bash -n deploy/recovery/kfaah_production_schema_gate.sh

      - name: Audit system-admin authorization guardrails
        run: python3 scripts/recovery/audit_admin_security.py

      - name: Audit service-role organization scope
        run: python3 scripts/recovery/audit_service_role_org_scope.py
      - name: Verify production bundle is independent
        run: |
          set -euo pipefail
          test -f dist/index.html
          if grep -REni 'lovable\.app|lovable\.dev|ai\.gateway\.lovable|\.supabase\.co' dist; then
            echo "Production bundle still contains a legacy cloud dependency" >&2
            exit 1
          fi
