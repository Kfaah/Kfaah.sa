name: Verify frontend build

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-build.yml'
      - 'deploy/build-frontend.sh'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh stale npm lockfile for review
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
      - name: Build with non-production test configuration
        env:
          VITE_SUPABASE_URL: https://preview.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
        run: bash deploy/build-frontend.sh
