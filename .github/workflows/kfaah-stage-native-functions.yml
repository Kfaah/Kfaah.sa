name: Kfaah Stage Native Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-native-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Package reviewed Edge Functions
        id: package
        run: |
          set -euo pipefail
          archive="/tmp/kfaah-functions-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive"             supabase/functions             supabase/migrations             src/integrations/supabase/types.ts
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FUNCTIONS_ARCHIVE_SHA256=$sha"

      - name: Download pinned Supabase CLI recovery archive
        id: cli
        run: |
          set -euo pipefail
          cli_archive="/tmp/supabase_2.118.0_linux_amd64.tar.gz"
          cli_sha="f6089a86fb9d9221c958193a277338daddd6822f706929943812fa32e106c86d"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/supabase/cli/releases/download/v2.118.0/supabase_2.118.0_linux_amd64.tar.gz" \
            -o "$cli_archive"
          printf '%s  %s\n' "$cli_sha" "$cli_archive" | sha256sum -c -
          echo "archive=$cli_archive" >> "$GITHUB_OUTPUT"
          echo "sha=$cli_sha" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/kfaah
          chmod 0600 ~/.ssh/kfaah
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Require limited recovery bootstrap
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" '
              set -e
              command -v /usr/local/bin/kfaah-backend-recovery >/dev/null 2>&1 || {
                echo "BOOTSTRAP_REQUIRED: /usr/local/bin/kfaah-backend-recovery is not installed"
                exit 42
              }
              test -w /var/lib/kfaah-recovery/incoming || {
                echo "BOOTSTRAP_REQUIRED: incoming recovery directory is not writable"
                exit 43
              }
              sudo -n /usr/local/bin/kfaah-backend-recovery audit
            '

      - name: Install pinned Supabase CLI on recovery path
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          CLI_ARCHIVE: ${{ steps.cli.outputs.archive }}
          CLI_SHA: ${{ steps.cli.outputs.sha }}
        run: |
          set -euo pipefail
          remote="/var/lib/kfaah-recovery/incoming/supabase-cli-v2.118.0.tar.gz"
          scp -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$CLI_ARCHIVE" "$HETZNER_USER@$HETZNER_HOST:$remote"
          ssh -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n /usr/local/bin/kfaah-backend-recovery install-cli '$remote' '$CLI_SHA'"

      - name: Upload reviewed archive
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          remote="/var/lib/kfaah-recovery/incoming/${ARCHIVE_SHA}.tar.gz"
          scp -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ARCHIVE" "$HETZNER_USER@$HETZNER_HOST:$remote"

      - name: Install reviewed functions and run native canary
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          ARCHIVE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          remote="/var/lib/kfaah-recovery/incoming/${ARCHIVE_SHA}.tar.gz"
          ssh -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n /usr/local/bin/kfaah-backend-recovery install-functions '$remote' '$ARCHIVE_SHA'"
          ssh -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n /usr/local/bin/kfaah-backend-recovery native-canary"

      - name: Remove uploaded archive after success
        if: success()
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          ARCHIVE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          ssh -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "rm -f '/var/lib/kfaah-recovery/incoming/${ARCHIVE_SHA}.tar.gz' '/var/lib/kfaah-recovery/incoming/supabase-cli-v2.118.0.tar.gz'"
