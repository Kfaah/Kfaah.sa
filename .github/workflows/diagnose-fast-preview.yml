name: Repair Kfaah Fast Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Write fast-preview environment
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy
          printf 'VITE_SUPABASE_URL=https://kfaah.sa\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY" |
            ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" '
              set -euo pipefail
              umask 077
              cat > /home/deploy/kfaah-fast/workspace/.env.local
              cp /home/deploy/kfaah-fast/workspace/.env.local /home/deploy/kfaah-fast/baseline/.env.local
              chmod 600 /home/deploy/kfaah-fast/workspace/.env.local /home/deploy/kfaah-fast/baseline/.env.local
              echo FAST_PREVIEW_ENV_WRITTEN
            '

      - name: Restart only Vite
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" '
            set -euo pipefail
            vite_pid="$(ps -C node -o pid=,args= | grep "node_modules/.bin/vite" | head -n 1 | sed -E "s/^ *([0-9]+).*/\1/" || true)"
            if [ -n "$vite_pid" ]; then
              kill "$vite_pid"
              for i in 1 2 3 4 5; do
                kill -0 "$vite_pid" 2>/dev/null || break
                sleep 1
              done
            fi
            rm -f /home/deploy/kfaah-fast/vite-allowed-host.txt
            echo FAST_PREVIEW_VITE_STOPPED
          '

      - name: Verify environment
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" '
            set -euo pipefail
            test -s /home/deploy/kfaah-fast/workspace/.env.local
            test -s /home/deploy/kfaah-fast/baseline/.env.local
            grep -q "^VITE_SUPABASE_URL=https://kfaah.sa$" /home/deploy/kfaah-fast/workspace/.env.local
            grep -q "^VITE_SUPABASE_PUBLISHABLE_KEY=." /home/deploy/kfaah-fast/workspace/.env.local
            echo FAST_PREVIEW_ENV_VERIFIED
          '
