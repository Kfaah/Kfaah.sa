name: Diagnose Stable Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect server
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" '
            set -u
            echo "=== identity ==="
            id
            echo "=== sudo rules ==="
            sudo -n -l || true
            echo "=== nginx sites ==="
            for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do
              [ -f "$f" ] || continue
              echo "--- $f"
              sed -n "1,260p" "$f" || true
            done
            echo "=== worker.py ==="
            sed -n "1,340p" /home/deploy/kfaah-fast/worker.py || true
            echo "=== worker processes ==="
            ps -u "$(id -u)" -o pid=,ppid=,comm=,args= | grep -E "worker.py|cloudflared|vite|node" | grep -v grep || true
            echo "=== crontab ==="
            crontab -l 2>/dev/null || true
            echo "=== user services ==="
            systemctl --user list-unit-files --type=service 2>/dev/null | grep -Ei "kfaah|worker|preview|vite|cloud" || true
            echo "=== listeners ==="
            ss -lnt | sed -n "1,120p"
          '
