name: Install Preview Self Heal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build worker patch
        run: |
          cat > patch-worker-selfheal.py <<'PY'
          from pathlib import Path
          import os
          import re
          import signal
          import subprocess
          import time

          root = Path("/home/deploy/kfaah-fast")
          path = root / "worker.py"
          text = path.read_text(encoding="utf-8")

          if 'LAST_PREVIEW = ROOT / "last-preview.json"' not in text:
              text = text.replace(
                  'TUNNEL_LOG = ROOT / "cloudflared.log"\n',
                  'TUNNEL_LOG = ROOT / "cloudflared.log"\nLAST_PREVIEW = ROOT / "last-preview.json"\n',
                  1,
              )

          ensure_vite = r'''def ensure_vite():
              if wait_http("http://127.0.0.1:4173/", attempts=1, delay=0):
                  return

              subprocess.run(
                  ["pkill", "-u", str(os.getuid()), "-f", "node.*vite"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              time.sleep(0.5)

              config = ensure_fast_vite_config()
              env = os.environ.copy()
              env["PATH"] = str(NODE_BIN) + os.pathsep + env.get("PATH", "")
              log_handle = open(VITE_LOG, "ab", buffering=0)
              subprocess.Popen(
                  [
                      str(NODE_BIN / "npm"),
                      "run",
                      "dev",
                      "--",
                      "--config",
                      str(config),
                      "--host",
                      "127.0.0.1",
                      "--port",
                      "4173",
                  ],
                  cwd=WORKSPACE,
                  env=env,
                  stdout=log_handle,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              if not wait_http("http://127.0.0.1:4173/"):
                  raise RuntimeError("Vite preview did not start")
          '''

          text, n = re.subn(
              r'def ensure_vite\(tunnel_url\):.*?(?=def read_tunnel_url\(\):)',
              ensure_vite + "\n",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1 and 'def ensure_vite():' not in text:
              raise SystemExit("Could not patch ensure_vite")

          ensure_tunnel = r'''def cloudflared_running():
              return subprocess.run(
                  ["pgrep", "-u", str(os.getuid()), "-x", "cloudflared"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          def stop_cloudflared():
              subprocess.run(
                  ["pkill", "-u", str(os.getuid()), "-x", "cloudflared"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              time.sleep(0.5)

          def tunnel_healthy(url):
              return bool(url and wait_http(url.rstrip("/") + "/", attempts=2, delay=0.2))

          def ensure_tunnel():
              current = read_tunnel_url()
              if current and cloudflared_running() and tunnel_healthy(current):
                  return current

              stop_cloudflared()
              try:
                  TUNNEL_LOG.unlink()
              except FileNotFoundError:
                  pass

              log_handle = open(TUNNEL_LOG, "ab", buffering=0)
              subprocess.Popen(
                  [str(CLOUDFLARED), "tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:4173"],
                  cwd=ROOT,
                  stdout=log_handle,
                  stderr=subprocess.STDOUT,
                  start_new_session=True,
              )
              for _ in range(80):
                  url = read_tunnel_url()
                  if url and tunnel_healthy(url):
                      return url
                  time.sleep(0.5)
              raise RuntimeError("Cloudflare preview tunnel did not start")
          '''

          text, n = re.subn(
              r'def ensure_tunnel\(\):.*?(?=def reset_workspace\(\):)',
              ensure_tunnel + "\n",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1 and 'def cloudflared_running():' not in text:
              raise SystemExit("Could not patch ensure_tunnel")

          announce = r'''def save_last_preview(job, announced_url):
              data = {
                  "commandId": str(job["commandId"]),
                  "callbackToken": job["callbackToken"],
                  "previewPath": job.get("previewPath") or "/",
                  "announcedUrl": announced_url,
              }
              LAST_PREVIEW.write_text(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )

          def send_preview_callback(job, tunnel_url):
              preview_path = job.get("previewPath") or "/"
              target = tunnel_url.rstrip("/") + preview_path
              if not wait_http(target, attempts=20, delay=0.25):
                  raise RuntimeError("Preview route did not become reachable")
              json_post("/_api/preview-live-ready", {
                  "commandId": str(job["commandId"]),
                  "token": job["callbackToken"],
                  "previewUrl": tunnel_url,
                  "previewPath": preview_path,
              })

          def announce_preview(job):
              ensure_vite()
              tunnel_url = ensure_tunnel()
              send_preview_callback(job, tunnel_url)
              save_last_preview(job, tunnel_url)

          def load_last_preview():
              if not LAST_PREVIEW.exists():
                  return None
              try:
                  return json.loads(LAST_PREVIEW.read_text(encoding="utf-8"))
              except Exception:
                  return None

          def maintain_preview():
              last = load_last_preview()
              if not last:
                  return
              ensure_vite()
              tunnel_url = ensure_tunnel()
              preview_path = last.get("previewPath") or "/"
              target = tunnel_url.rstrip("/") + preview_path
              if not wait_http(target, attempts=2, delay=0.2):
                  raise RuntimeError("Current preview route is not reachable")
              if last.get("announcedUrl") != tunnel_url:
                  json_post("/_api/preview-live-ready", {
                      "commandId": str(last["commandId"]),
                      "token": last["callbackToken"],
                      "previewUrl": tunnel_url,
                      "previewPath": preview_path,
                  })
                  last["announcedUrl"] = tunnel_url
                  LAST_PREVIEW.write_text(
                      json.dumps(last, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  log("preview tunnel refreshed: " + tunnel_url)
          '''

          text, n = re.subn(
              r'def announce_preview\(job\):.*?(?=def finish_job\(job, ok, error=None\):)',
              announce + "\n",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1 and 'def maintain_preview():' not in text:
              raise SystemExit("Could not patch announce/maintenance")

          main = r'''def main():
              ROOT.mkdir(parents=True, exist_ok=True)
              if not PRIVATE_KEY.exists():
                  raise RuntimeError("worker private key missing")
              ensure_vite()
              tunnel_url = ensure_tunnel()
              log("worker started at " + tunnel_url)
              last_maintenance = 0.0
              while True:
                  now = time.time()
                  if now - last_maintenance >= 5.0:
                      try:
                          maintain_preview()
                      except Exception as exc:
                          log("preview maintenance error: " + repr(exc))
                      last_maintenance = now
                  try:
                      with signed_request("GET", "/_api/worker-next-job", timeout=15) as response:
                          if response.status == 204:
                              time.sleep(0.6)
                              continue
                          data = json.loads(response.read().decode())
                          job = data.get("job")
                          if job:
                              process_job(job)
                          else:
                              time.sleep(0.6)
                  except urllib.error.HTTPError as exc:
                      if exc.code in (204, 404, 503):
                          time.sleep(1.0)
                      else:
                          log("poll HTTP error " + str(exc.code))
                          time.sleep(2.0)
                  except Exception as exc:
                      log("poll error: " + repr(exc))
                      time.sleep(2.0)
          '''

          text, n = re.subn(
              r'def main\(\):.*?(?=if __name__ == "__main__":)',
              main + "\n",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("Could not patch main loop")

          path.write_text(text, encoding="utf-8")
          subprocess.run(["python3", "-m", "py_compile", str(path)], check=True)

          worker_pids = []
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  cmdline = (proc / "cmdline").read_bytes().replace(b"\x00", b" ").decode(errors="ignore")
              except Exception:
                  continue
              if str(path) in cmdline and "python" in cmdline:
                  worker_pids.append(int(proc.name))

          for pid in worker_pids:
              try:
                  os.kill(pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
          if worker_pids:
              time.sleep(1.0)

          env = os.environ.copy()
          env["KFAAH_FAST_ROOT"] = str(root)
          env["PATH"] = str(root / "node" / "bin") + os.pathsep + env.get("PATH", "")
          log_handle = open(root / "worker.log", "ab", buffering=0)
          subprocess.Popen(
              ["python3", str(path)],
              cwd=root,
              env=env,
              stdout=log_handle,
              stderr=subprocess.STDOUT,
              start_new_session=True,
          )

          time.sleep(2.0)
          found = False
          for proc in Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  cmdline = (proc / "cmdline").read_bytes().replace(b"\x00", b" ").decode(errors="ignore")
              except Exception:
                  continue
              if str(path) in cmdline and "python" in cmdline:
                  found = True
                  break
          if not found:
              raise SystemExit("Worker did not restart")

          print("PREVIEW_SELF_HEAL_INSTALLED")
          PY

      - name: Install on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy
          scp -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            patch-worker-selfheal.py \
            "$HETZNER_USER@$HETZNER_HOST:/home/deploy/kfaah-fast/tmp/patch-worker-selfheal.py"
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" \
            'python3 /home/deploy/kfaah-fast/tmp/patch-worker-selfheal.py && rm -f /home/deploy/kfaah-fast/tmp/patch-worker-selfheal.py'

      - name: Verify
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" '
            set -euo pipefail
            grep -q "def maintain_preview" /home/deploy/kfaah-fast/worker.py
            grep -q "LAST_PREVIEW" /home/deploy/kfaah-fast/worker.py
            pgrep -u "$(id -u)" -f "/home/deploy/kfaah-fast/worker.py" >/dev/null
            curl -fsS http://127.0.0.1:4173/ -o /dev/null
            echo PREVIEW_SELF_HEAL_VERIFIED
          '
