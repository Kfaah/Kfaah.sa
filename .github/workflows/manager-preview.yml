name: Kfaah Manager Internal Preview

run-name: Kfaah internal preview ${{ inputs.command_id }}

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: "Manager command id"
        required: true
        type: string
      preview_url:
        description: "Live fast-preview base URL"
        required: true
        type: string
      preview_path:
        description: "Route to capture"
        required: true
        default: "/"
        type: string
      preview_callback_token:
        description: "Preview callback token"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kfaah-manager-preview-${{ inputs.command_id }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Mask callback token
        run: echo "::add-mask::${{ inputs.preview_callback_token }}"

      - name: Capture fast preview
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          PREVIEW_PATH: ${{ inputs.preview_path }}
        run: |
          set -euo pipefail

          case "$PREVIEW_URL" in
            https://*.trycloudflare.com|https://*.trycloudflare.com/|https://staging.kfaah.sa|https://staging.kfaah.sa/) ;;
            *) echo "Invalid preview URL" >&2; exit 1 ;;
          esac

          case "$PREVIEW_PATH" in
            /*) ;;
            *) echo "Invalid preview path" >&2; exit 1 ;;
          esac

          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.1 >/dev/null
          npx playwright install --with-deps chromium

          target="${PREVIEW_URL%/}$PREVIEW_PATH"
          if [[ "$target" == *"?"* ]]; then
            target="$target&preview=true"
          else
            target="$target?preview=true"
          fi

          cat > /tmp/capture-preview.mjs <<'NODE'
          import { chromium } from "playwright";

          const target = process.env.TARGET_URL;
          const browser = await chromium.launch({ headless: true });

          async function capture(name, width, height) {
            const context = await browser.newContext({ viewport: { width, height } });
            const page = await context.newPage();

            page.on("console", (msg) => {
              console.log("BROWSER_CONSOLE", name, msg.type(), msg.text());
            });
            page.on("pageerror", (error) => {
              console.log("BROWSER_PAGE_ERROR", name, error.message);
            });
            page.on("requestfailed", (request) => {
              console.log("BROWSER_REQUEST_FAILED", name, request.url(), request.failure()?.errorText || "");
            });

            const response = await page.goto(target, {
              waitUntil: "domcontentloaded",
              timeout: 45000,
            });

            console.log("BROWSER_NAV", name, response?.status() ?? "no-response", page.url());

            await page.waitForTimeout(7000);

            const bodyText = await page.locator("body").innerText().catch(() => "");
            const html = await page.content().catch(() => "");

            console.log("BROWSER_BODY_TEXT", name, JSON.stringify(bodyText.slice(0, 2000)));
            console.log("BROWSER_HTML_LENGTH", name, html.length);

            await page.screenshot({
              path: `internal-preview-${name}.png`,
              fullPage: true,
            });

            if (!bodyText.trim()) {
              throw new Error(`Preview rendered an empty body for ${name}`);
            }

            await context.close();
          }

          try {
            await capture("desktop", 1440, 900);
            await capture("mobile", 390, 844);
          } finally {
            await browser.close();
          }
          NODE

          TARGET_URL="$target" node /tmp/capture-preview.mjs

          test -s internal-preview-desktop.png
          test -s internal-preview-mobile.png

      - name: Store preview in Kfaah Manager
        env:
          COMMAND_ID: ${{ inputs.command_id }}
          PREVIEW_PATH: ${{ inputs.preview_path }}
          PREVIEW_CALLBACK_TOKEN: ${{ inputs.preview_callback_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PREVIEW_CALLBACK_TOKEN"

          desktop_size="$(stat -c%s internal-preview-desktop.png)"
          mobile_size="$(stat -c%s internal-preview-mobile.png)"

          payload="$(jq -n \
            --arg commandId "$COMMAND_ID" \
            --arg token "$PREVIEW_CALLBACK_TOKEN" \
            --arg previewPath "$PREVIEW_PATH" \
            --argjson desktopSize "$desktop_size" \
            --argjson mobileSize "$mobile_size" \
            '{commandId:$commandId,token:$token,previewPath:$previewPath,desktopSize:$desktopSize,mobileSize:$mobileSize}')"

          target="$(curl --fail-with-body -sS \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            https://kfaah-manager.floot.app/_api/preview-upload-target)"

          desktop_url="$(printf '%s' "$target" | jq -r '.desktopPresignedUrl')"
          mobile_url="$(printf '%s' "$target" | jq -r '.mobilePresignedUrl')"

          curl -fsS -X PUT -H 'Content-Type: image/png' --data-binary @internal-preview-desktop.png "$desktop_url"
          curl -fsS -X PUT -H 'Content-Type: image/png' --data-binary @internal-preview-mobile.png "$mobile_url"

          complete="$(jq -n \
            --arg commandId "$COMMAND_ID" \
            --arg token "$PREVIEW_CALLBACK_TOKEN" \
            '{commandId:$commandId,token:$token}')"

          curl --fail-with-body -sS \
            -H 'Content-Type: application/json' \
            -d "$complete" \
            https://kfaah-manager.floot.app/_api/preview-upload-complete

      - name: Save preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfaah-internal-preview-${{ github.run_id }}
          path: |
            internal-preview-desktop.png
            internal-preview-mobile.png
          if-no-files-found: ignore
          retention-days: 7
