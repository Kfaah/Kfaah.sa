name: Kfaah Migration Replay

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kfaah-migration-replay.yml'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'src/integrations/supabase/types.ts'
      - 'scripts/recovery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase db start

      - name: Replay all source migrations from scratch
        run: supabase db reset

      - name: Query locally replayed public tables
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -1)"
          test -n "$db_container"
          docker exec "$db_container" psql -U postgres -d postgres -X -At \
            -c "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by table_name;" \
            > /tmp/kfaah-local-tables.txt
          docker exec "$db_container" psql -U postgres -d postgres -X -At -F '|' \
            -c "select table_name,column_name from information_schema.columns where table_schema='public' order by table_name,ordinal_position;" \
            > /tmp/kfaah-local-columns.txt
          test -s /tmp/kfaah-local-tables.txt
          test -s /tmp/kfaah-local-columns.txt
          echo "catalog_tables=$(wc -l < /tmp/kfaah-local-tables.txt)"
          echo "catalog_columns=$(wc -l < /tmp/kfaah-local-columns.txt)"

      - name: Compare table contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def committed_tables(path: str):
              lines = Path(path).read_text(encoding="utf-8", errors="replace").splitlines()
              out = []
              in_tables = False
              for line in lines:
                  if line.strip() == "Tables: {":
                      in_tables = True
                      continue
                  if not in_tables:
                      continue
                  if line.startswith("    Views:"):
                      break
                  m = re.match(r"^      ([A-Za-z0-9_]+): \{$", line)
                  if m:
                      out.append(m.group(1))
              return sorted(set(out))

          expected = committed_tables("src/integrations/supabase/types.ts")
          actual = sorted({
              line.strip()
              for line in Path("/tmp/kfaah-local-tables.txt").read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()
              if line.strip()
          })

          if not expected:
              raise SystemExit("Could not parse the committed application table contract")
          if not actual:
              raise SystemExit("PostgreSQL catalog returned no public base tables after replay")

          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))

          print(f"EXPECTED_TABLES={len(expected)}")
          print(f"LOCAL_REPLAY_TABLES={len(actual)}")
          print(f"MISSING_AFTER_REPLAY={len(missing)}")
          for x in missing:
              print("MISSING|" + x)
          print(f"EXTRA_AFTER_REPLAY={len(extra)}")
          for x in extra:
              print("EXTRA|" + x)

          if missing:
              raise SystemExit("Migration replay did not reproduce the application table contract")

          # Compare the committed Row contract at column granularity as well.
          lines = Path("src/integrations/supabase/types.ts").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          expected_columns = set()
          in_tables = False
          current_table = None
          in_row = False

          for line in lines:
              if line.strip() == "Tables: {":
                  in_tables = True
                  continue
              if not in_tables:
                  continue
              if line.startswith("    Views:"):
                  break

              table_match = re.match(r"^      ([A-Za-z0-9_]+): \\{$", line)
              if table_match:
                  current_table = table_match.group(1)
                  in_row = False
                  continue

              if current_table and line == "        Row: {":
                  in_row = True
                  continue

              if in_row:
                  if line == "        }":
                      in_row = False
                      continue
                  column_match = re.match(r"^          ([A-Za-z0-9_]+): ", line)
                  if column_match:
                      expected_columns.add((current_table, column_match.group(1)))

          actual_columns = set()
          for raw in Path("/tmp/kfaah-local-columns.txt").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines():
              if not raw.strip() or "|" not in raw:
                  continue
              table_name, column_name = raw.split("|", 1)
              actual_columns.add((table_name.strip(), column_name.strip()))

          if not expected_columns:
              raise SystemExit("Could not parse committed column contract")

          missing_columns = sorted(expected_columns - actual_columns)
          print(f"EXPECTED_COLUMNS={len(expected_columns)}")
          print(f"LOCAL_REPLAY_COLUMNS={len(actual_columns)}")
          print(f"MISSING_COLUMNS_AFTER_REPLAY={len(missing_columns)}")
          for table_name, column_name in missing_columns:
              print(f"MISSING_COLUMN|{table_name}|{column_name}")

          if missing_columns:
              raise SystemExit("Migration replay did not reproduce the application column contract")
          PY

      - name: Static Edge Function authorization audit
        run: python3 scripts/recovery/audit_edge_function_auth.py
