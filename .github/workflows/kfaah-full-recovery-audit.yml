name: Kfaah Full Recovery Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kfaah-full-recovery-audit.yml'
      - '.kfaah/requests/2026-09-28-full-platform-recovery.md'
      - 'src/**'
      - 'supabase/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  source-and-runtime-audit:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kfaah.sa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KFAAH_DEPLOY_TARGET: production
      KFAAH_EXPECTED_API_URL: https://kfaah.sa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Inventory frontend/backend contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          src_files = list((root/'src').rglob('*.ts')) + list((root/'src').rglob('*.tsx'))
          fn_files = list((root/'supabase'/'functions').glob('*/index.ts'))
          migration_files = list((root/'supabase'/'migrations').glob('*.sql'))

          def read(p):
              return p.read_text(encoding='utf-8', errors='replace')

          invoked = set()
          buckets = set()
          envs = set()
          table_refs = set()

          invoke_re = re.compile(r'functions\s*\.\s*invoke\(\s*[\\"\']([^\\"\']+)[\\"\']', re.S)
          bucket_re = re.compile(r'storage\s*\.\s*from\(\s*[\\"\']([^\\"\']+)[\\"\']', re.S)
          from_re = re.compile(r'(?<!storage)\s*\.\s*from\(\s*[\\"\']([^\\"\']+)[\\"\']', re.S)
          env_re = re.compile(r'Deno\.env\.get\(\s*[\\"\']([^\\"\']+)[\\"\']\s*\)')

          for p in src_files:
              t=read(p)
              invoked.update(invoke_re.findall(t))
              buckets.update(bucket_re.findall(t))
              table_refs.update(from_re.findall(t))

          for p in fn_files:
              t=read(p)
              buckets.update(bucket_re.findall(t))
              table_refs.update(from_re.findall(t))
              envs.update(env_re.findall(t))

          available = {p.parent.name for p in fn_files}
          missing_functions = sorted(invoked - available)

          migrations = '\n'.join(read(p) for p in migration_files)
          bucket_markers = set(re.findall(r"(?:VALUES\s*\(\s*|id\s*=\s*)['\"]([a-zA-Z0-9_-]+)['\"]", migrations, re.I))
          missing_bucket_defs = sorted(b for b in buckets if b not in bucket_markers)

          print('=== FRONTEND INVOKED FUNCTIONS ===')
          for x in sorted(invoked): print(x)
          print('COUNT', len(invoked))
          print()
          print('=== SOURCE FUNCTION DIRECTORIES ===')
          for x in sorted(available): print(x)
          print('COUNT', len(available))
          print()
          print('=== INVOKED BUT SOURCE MISSING ===')
          print('\n'.join(missing_functions) if missing_functions else 'NONE')
          print()
          print('=== STORAGE BUCKET REFERENCES ===')
          for x in sorted(buckets): print(x)
          print('COUNT', len(buckets))
          print()
          print('=== REFERENCED BUCKETS WITHOUT OBVIOUS MIGRATION DEFINITION ===')
          print('\n'.join(missing_bucket_defs) if missing_bucket_defs else 'NONE')
          print()
          print('=== EDGE FUNCTION ENV NAMES ===')
          for x in sorted(envs): print(x)
          print('COUNT', len(envs))
          print()
          print('=== DATABASE TABLE/RPC-LIKE .from REFERENCES (STATIC) ===')
          for x in sorted(table_refs): print(x)
          print('COUNT', len(table_refs))

          legacy=[]
          for p in list(root.rglob('*.ts'))+list(root.rglob('*.tsx'))+list(root.rglob('*.js'))+list(root.rglob('*.yml'))+list(root.rglob('*.yaml')):
              if any(part in {'.git','node_modules'} for part in p.parts): continue
              t=read(p)
              if re.search(r'https://[a-z0-9]+\.supabase\.co|lovable\.(?:app|dev)|ai\.gateway\.lovable', t, re.I):
                  legacy.append(str(p))
          print()
          print('=== LEGACY CLOUD REFERENCES IN SOURCE ===')
          print('\n'.join(sorted(set(legacy))) if legacy else 'NONE')
          PY

      - name: Build production frontend
        run: bash deploy/build-frontend.sh

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Runtime HTTP gateway probes
        run: |
          set +e
          echo "=== PUBLIC HTTP PROBES ==="
          for url in             https://kfaah.sa/             https://kfaah.sa/auth/v1/health             https://kfaah.sa/rest/v1/             https://kfaah.sa/storage/v1/             https://kfaah.sa/functions/v1/__kfaah_missing_probe__; do
            code=$(curl -L --connect-timeout 10 --max-time 25 -sS -o /tmp/probe.out -w '%{http_code}' "$url")
            size=$(wc -c < /tmp/probe.out 2>/dev/null || echo 0)
            echo "$code bytes=$size $url"
          done
          echo
          echo "=== BODY SIZE GATE PROBES (UNAUTHENTICATED; MUST NOT WRITE) ==="
          for mb in 2 10; do
            head -c "$((mb*1024*1024))" /dev/zero > /tmp/probe.bin
            code=$(curl --connect-timeout 10 --max-time 35 -sS -o /tmp/upload-probe.out -w '%{http_code}'               -X POST -H 'Content-Type: application/octet-stream'               --data-binary @/tmp/probe.bin               "https://kfaah.sa/storage/v1/object/__kfaah_probe__/probe-$mb-mb.bin")
            echo "$mb MB => HTTP $code response_bytes=$(wc -c < /tmp/upload-probe.out)"
          done
          exit 0

      - name: Read-only Hetzner gateway audit
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_audit"
          chmod 600 "$HOME/.ssh/id_kfaah_audit"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_kfaah_audit" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== SERVER TIME/HOST ==="
          date -u
          hostname
          echo
          echo "=== SERVICE STATES ==="
          for s in nginx kfaah-functions kfaah-supabase kfaah-mail-sync kfaah-offsite-backup; do
            printf '%-28s ' "$s"
            systemctl is-active "$s" 2>/dev/null || true
          done
          echo
          echo "=== NGINX KFAAH SITE ==="
          sed -n '1,220p' /etc/nginx/sites-enabled/kfaah 2>&1
          echo
          echo "=== NGINX BODY LIMITS ==="
          grep -Rni --include='*.conf' --include='kfaah' 'client_max_body_size' /etc/nginx 2>&1 | head -100
          echo
          echo "=== LOCAL GATEWAY PORTS ==="
          for port in 8000 9001; do
            (echo >/dev/tcp/127.0.0.1/$port) >/dev/null 2>&1 && echo "$port OPEN" || echo "$port CLOSED"
          done
          echo
          echo "=== LOCAL SUPABASE HEALTH ==="
          curl --connect-timeout 5 --max-time 10 -sS -o /tmp/auth-health -w 'auth=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8000/auth/v1/health
          curl --connect-timeout 5 --max-time 10 -sS -o /tmp/rest-root -w 'rest=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8000/rest/v1/
          curl --connect-timeout 5 --max-time 10 -sS -o /tmp/storage-root -w 'storage=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8000/storage/v1/
          echo
          echo "=== FUNCTION ROUTE GET PROBES (READ-ONLY) ==="
          for fn in             analyze-uploaded-file parse-staff-duties-xlsx run-intelligence             generate-plan-deep generate-plan-from-excel generate-executive-plans             deep-org-analysis process-upload extract-website-info import-org-documents             create-employee evaluate-task-quality top-up-employee-tasks verify-evidence             innovation-suggestions innovation-chat admin-insights executive-report             classify-expense-batch suggest-finance-reports donor-insights report-suggestions             smart-task-dispatcher generate-related-tasks marketing-radar             marketing-suggest-campaigns marketing-generate-content marketing-evaluate-campaign             send-transactional-email fetch-platform-email-replies org-self-signup             create-org-viewer-accounts notify-task-message __kfaah_missing_probe__; do
            code=$(curl --connect-timeout 3 --max-time 8 -sS -o /tmp/fn-probe -w '%{http_code}' "http://127.0.0.1:9001/functions/v1/$fn")
            size=$(wc -c < /tmp/fn-probe 2>/dev/null || echo 0)
            prefix=$(head -c 120 /tmp/fn-probe 2>/dev/null | tr '\n' ' ' | tr -cd '[:print:]')
            echo "$fn => $code bytes=$size body=$prefix"
          done
          REMOTE
