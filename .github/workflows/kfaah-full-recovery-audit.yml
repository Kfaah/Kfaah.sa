name: Kfaah Full Recovery Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kfaah-full-recovery-audit.yml'
      - '.kfaah/requests/2026-09-28-full-platform-recovery.md'
      - 'src/**'
      - 'supabase/**'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  source-and-runtime-audit:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kfaah.sa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      KFAAH_DEPLOY_TARGET: production
      KFAAH_EXPECTED_API_URL: https://kfaah.sa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Inventory frontend/backend contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          src_files = list((root/'src').rglob('*.ts')) + list((root/'src').rglob('*.tsx'))
          fn_files = list((root/'supabase'/'functions').glob('*/index.ts'))
          migration_files = list((root/'supabase'/'migrations').glob('*.sql'))

          def read(p):
              return p.read_text(encoding='utf-8', errors='replace')

          invoked = set()
          buckets = set()
          envs = set()
          table_refs = set()

          invoke_re = re.compile(r'functions\s*\.\s*invoke\(\s*[\\"\']([^\\"\']+)[\\"\']', re.S)
          bucket_re = re.compile(r'storage\s*\.\s*from\(\s*[\\"\']([^\\"\']+)[\\"\']', re.S)
          from_re = re.compile(r'(?<!storage)\s*\.\s*from\(\s*[\\"\']([^\\"\']+)[\\"\']', re.S)
          env_re = re.compile(r'Deno\.env\.get\(\s*[\\"\']([^\\"\']+)[\\"\']\s*\)')

          for p in src_files:
              t=read(p)
              invoked.update(invoke_re.findall(t))
              buckets.update(bucket_re.findall(t))
              table_refs.update(from_re.findall(t))

          for p in fn_files:
              t=read(p)
              buckets.update(bucket_re.findall(t))
              table_refs.update(from_re.findall(t))
              envs.update(env_re.findall(t))

          available = {p.parent.name for p in fn_files}
          missing_functions = sorted(invoked - available)

          migrations = '\n'.join(read(p) for p in migration_files)
          bucket_markers = set(re.findall(r"(?:VALUES\s*\(\s*|id\s*=\s*)['\"]([a-zA-Z0-9_-]+)['\"]", migrations, re.I))
          missing_bucket_defs = sorted(b for b in buckets if b not in bucket_markers)

          print('=== FRONTEND INVOKED FUNCTIONS ===')
          for x in sorted(invoked): print(x)
          print('COUNT', len(invoked))
          print()
          print('=== SOURCE FUNCTION DIRECTORIES ===')
          for x in sorted(available): print(x)
          print('COUNT', len(available))
          print()
          print('=== INVOKED BUT SOURCE MISSING ===')
          print('\n'.join(missing_functions) if missing_functions else 'NONE')
          print()
          print('=== STORAGE BUCKET REFERENCES ===')
          for x in sorted(buckets): print(x)
          print('COUNT', len(buckets))
          print()
          print('=== REFERENCED BUCKETS WITHOUT OBVIOUS MIGRATION DEFINITION ===')
          print('\n'.join(missing_bucket_defs) if missing_bucket_defs else 'NONE')
          print()
          print('=== EDGE FUNCTION ENV NAMES ===')
          for x in sorted(envs): print(x)
          print('COUNT', len(envs))
          print()
          print('=== DATABASE TABLE/RPC-LIKE .from REFERENCES (STATIC) ===')
          for x in sorted(table_refs): print(x)
          print('COUNT', len(table_refs))

          legacy=[]
          for p in list(root.rglob('*.ts'))+list(root.rglob('*.tsx'))+list(root.rglob('*.js'))+list(root.rglob('*.yml'))+list(root.rglob('*.yaml')):
              if any(part in {'.git','node_modules'} for part in p.parts): continue
              t=read(p)
              if re.search(r'https://[a-z0-9]+\.supabase\.co|lovable\.(?:app|dev)|ai\.gateway\.lovable', t, re.I):
                  legacy.append(str(p))
          print()
          print('=== LEGACY CLOUD REFERENCES IN SOURCE ===')
          print('\n'.join(sorted(set(legacy))) if legacy else 'NONE')
          PY

      - name: Build production frontend
        run: bash deploy/build-frontend.sh

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Runtime HTTP gateway probes
        run: |
          set +e
          echo "=== PUBLIC HTTP PROBES ==="
          for url in             https://kfaah.sa/             https://kfaah.sa/auth/v1/health             https://kfaah.sa/rest/v1/             https://kfaah.sa/storage/v1/             https://kfaah.sa/functions/v1/__kfaah_missing_probe__; do
            code=$(curl -L --connect-timeout 10 --max-time 25 -sS -o /tmp/probe.out -w '%{http_code}' "$url")
            size=$(wc -c < /tmp/probe.out 2>/dev/null || echo 0)
            echo "$code bytes=$size $url"
          done
          echo
          echo "=== BODY SIZE GATE PROBES (UNAUTHENTICATED; MUST NOT WRITE) ==="
          for mb in 2 10; do
            head -c "$((mb*1024*1024))" /dev/zero > /tmp/probe.bin
            code=$(curl --connect-timeout 10 --max-time 35 -sS -o /tmp/upload-probe.out -w '%{http_code}'               -X POST -H 'Content-Type: application/octet-stream'               --data-binary @/tmp/probe.bin               "https://kfaah.sa/storage/v1/object/__kfaah_probe__/probe-$mb-mb.bin")
            echo "$mb MB => HTTP $code response_bytes=$(wc -c < /tmp/upload-probe.out)"
          done
          exit 0

      - name: Read-only Hetzner gateway audit
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_audit"
          chmod 600 "$HOME/.ssh/id_kfaah_audit"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/id_kfaah_audit" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== SERVER TIME/HOST ==="
          date -u
          hostname
          echo
          echo "=== SERVICE STATES ==="
          for s in nginx kfaah-functions kfaah-supabase kfaah-mail-sync kfaah-offsite-backup; do
            printf '%-28s ' "$s"
            systemctl is-active "$s" 2>/dev/null || true
          done
          echo
          echo "=== NGINX KFAAH SITE ==="
          sed -n '1,220p' /etc/nginx/sites-enabled/kfaah 2>&1
          echo
          echo "=== NGINX BODY LIMITS ==="
          grep -Rni --include='*.conf' --include='kfaah' 'client_max_body_size' /etc/nginx 2>&1 | head -100
          echo
          echo "=== LOCAL GATEWAY PORTS ==="
          for port in 8000 9001; do
            (echo >/dev/tcp/127.0.0.1/$port) >/dev/null 2>&1 && echo "$port OPEN" || echo "$port CLOSED"
          done
          echo
          echo "=== LOCAL SUPABASE HEALTH ==="
          curl --connect-timeout 5 --max-time 10 -sS -o /tmp/auth-health -w 'auth=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8000/auth/v1/health
          curl --connect-timeout 5 --max-time 10 -sS -o /tmp/rest-root -w 'rest=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8000/rest/v1/
          curl --connect-timeout 5 --max-time 10 -sS -o /tmp/storage-root -w 'storage=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8000/storage/v1/
          echo
          echo "=== FUNCTION ROUTE PROBES ==="
          echo "Skipped here: function existence is checked with non-mutating OPTIONS in the next step."
          REMOTE

      - name: Safe OPTIONS inventory for all frontend functions
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_audit"
          chmod 600 "$HOME/.ssh/id_kfaah_audit"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_kfaah_audit" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'bash -s' <<'REMOTE'
          set +e
          for fn in \
            admin-insights analyze-organization analyze-uploaded-file classify-expense-batch \
            create-employee create-org-viewer-accounts daily-donor-intelligence deep-org-analysis \
            delete-employee discover-org-accounts donor-insights evaluate-task-quality executive-report \
            extract-website-info fetch-platform-email-replies generate-executive-plans generate-plan-deep \
            generate-plan-from-excel generate-related-tasks generate-smart-report handle-email-unsubscribe \
            impersonate-user import-org-documents innovation-chat innovation-suggestions marketing-design-brief \
            marketing-evaluate-campaign marketing-generate-content marketing-radar marketing-suggest-campaigns \
            notify-task-message org-self-signup parse-staff-duties-xlsx process-upload report-suggestions \
            run-intelligence secure-backup-to-github send-transactional-email setup-demo smart-task-dispatcher \
            suggest-finance-reports sync-external-source top-up-employee-tasks verify-evidence; do
            code=$(curl -X OPTIONS --connect-timeout 3 --max-time 6 -sS -o /tmp/options-probe -w '%{http_code}' "http://127.0.0.1:9001/functions/v1/$fn")
            size=$(wc -c < /tmp/options-probe 2>/dev/null || echo 0)
            prefix=$(head -c 140 /tmp/options-probe 2>/dev/null | tr '\n' ' ' | tr -cd '[:print:]')
            echo "OPTIONS $fn => $code bytes=$size body=$prefix"
          done
          REMOTE

      - name: Authenticated demo storage smoke test
        env:
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANON_KEY"
          echo "::add-mask::$ANON_KEY"
          base="https://kfaah.sa"
          demo_org="00000000-0000-0000-0000-0000000000de"

          setup_code=$(curl --connect-timeout 8 --max-time 25 -sS -o /tmp/demo-setup.json -w '%{http_code}' \
            -X POST "$base/functions/v1/setup-demo" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "setup-demo HTTP=$setup_code bytes=$(wc -c < /tmp/demo-setup.json)"
          email=$(jq -r '.email // empty' /tmp/demo-setup.json)
          password=$(jq -r '.password // empty' /tmp/demo-setup.json)
          test -n "$email"
          test -n "$password"

          login_code=$(curl --connect-timeout 8 --max-time 25 -sS -o /tmp/demo-login.json -w '%{http_code}' \
            -X POST "$base/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')")
          echo "demo-login HTTP=$login_code bytes=$(wc -c < /tmp/demo-login.json)"
          access=$(jq -r '.access_token // empty' /tmp/demo-login.json)
          test -n "$access"
          echo "::add-mask::$access"

          path="$demo_org/archive/audit/kfaah-smoke-${GITHUB_RUN_ID}.txt"
          printf 'Kfaah storage smoke test %s\n' "$GITHUB_RUN_ID" > /tmp/kfaah-smoke.txt
          upload_code=$(curl --connect-timeout 8 --max-time 25 -sS -o /tmp/storage-upload.json -w '%{http_code}' \
            -X POST "$base/storage/v1/object/org-documents/$path" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $access" \
            -H 'Content-Type: text/plain' \
            -H 'x-upsert: false' \
            --data-binary @/tmp/kfaah-smoke.txt)
          echo "org-documents upload HTTP=$upload_code body=$(head -c 300 /tmp/storage-upload.json | tr '\n' ' ')"

          if [[ "$upload_code" =~ ^2 ]]; then
            signed_code=$(curl --connect-timeout 8 --max-time 25 -sS -o /tmp/storage-signed.json -w '%{http_code}' \
              -X POST "$base/storage/v1/object/sign/org-documents/$path" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $access" \
              -H 'Content-Type: application/json' \
              -d '{"expiresIn":60}')
            echo "org-documents signed-url HTTP=$signed_code bytes=$(wc -c < /tmp/storage-signed.json)"

            delete_code=$(curl --connect-timeout 8 --max-time 25 -sS -o /tmp/storage-delete.json -w '%{http_code}' \
              -X DELETE "$base/storage/v1/object/org-documents/$path" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $access")
            echo "org-documents cleanup HTTP=$delete_code bytes=$(wc -c < /tmp/storage-delete.json)"
          fi

          # Fail the smoke step if the principal upload path used by Uploads.tsx is broken.
          [[ "$upload_code" =~ ^2 ]]
