name: Kfaah Production Schema Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-schema-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/kfaah
          chmod 0600 ~/.ssh/kfaah
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Run production schema acceptance gate
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kfaah -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "sudo -n /usr/local/bin/kfaah-backend-recovery schema-gate"
