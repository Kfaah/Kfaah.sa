name: Manager Chat UI E2E

on:
  workflow_dispatch:
    inputs:
      session_cookie:
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Mask session
        run: echo "::add-mask::${{ inputs.session_cookie }}"

      - name: Test manager chat layout
        env:
          SESSION_COOKIE: ${{ inputs.session_cookie }}
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

          cat > e2e.mjs <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1600, height: 1000 } });
          await context.addCookies([{
            name: "floot_built_app_session",
            value: process.env.SESSION_COOKIE,
            domain: "kfaah-manager.floot.app",
            path: "/",
            secure: true,
            httpOnly: true,
            sameSite: "Lax",
          }]);

          const page = await context.newPage();
          const errors = [];
          page.on("pageerror", e => errors.push("pageerror: " + e.message));
          page.on("requestfailed", r => errors.push("requestfailed: " + r.url() + " " + (r.failure()?.errorText || "")));

          await page.goto("https://kfaah-manager.floot.app/", {
            waitUntil: "domcontentloaded",
            timeout: 45000,
          });
          await page.getByRole("heading", { name: "منصة كفاءة" }).waitFor({ timeout: 30000 });
          await page.getByText("المطالبات", { exact: true }).waitFor({ timeout: 30000 });
          await page.locator('textarea[placeholder*="اكتب رسالة"]').waitFor({ timeout: 30000 });
          await page.waitForTimeout(4000);

          const threadHeading = page.getByText("المطالبات", { exact: true }).first();
          const threadSection = threadHeading.locator("xpath=ancestor::section[1]");
          const previewHeading = page.getByText("المعاينة قبل النشر", { exact: true }).first();
          const previewSection = previewHeading.locator("xpath=ancestor::section[1]");
          const textarea = page.locator('textarea[placeholder*="اكتب رسالة"]').first();
          const chatSection = textarea.locator("xpath=ancestor::section[1]");

          const [threadBox, chatBox, previewBox, textBox] = await Promise.all([
            threadSection.boundingBox(),
            chatSection.boundingBox(),
            previewSection.boundingBox(),
            textarea.boundingBox(),
          ]);

          if (!threadBox || !chatBox || !previewBox || !textBox) throw new Error("Missing layout boxes");

          const metrics = await page.evaluate(() => ({
            scrollHeight: document.documentElement.scrollHeight,
            innerHeight: window.innerHeight,
          }));

          const newButton = page.getByRole("button", { name: /جديدة/ }).first();
          await newButton.click();
          await page.getByText("ما الذي تريد تعديله؟", { exact: true }).waitFor({ timeout: 10000 });
          const newTextBox = await textarea.boundingBox();

          const layout = {
            threadX: threadBox.x,
            chatX: chatBox.x,
            previewX: previewBox.x,
            threadRight: threadBox.x + threadBox.width,
            chatRight: chatBox.x + chatBox.width,
            previewRight: previewBox.x + previewBox.width,
            composerVisible: textBox.y >= 0 && textBox.y + textBox.height <= 1000,
            composerVisibleAfterNew: !!newTextBox && newTextBox.y >= 0 && newTextBox.y + newTextBox.height <= 1000,
            pageFitsViewport: metrics.scrollHeight <= metrics.innerHeight + 8,
            errors,
          };

          console.log("CHAT_UI_E2E", JSON.stringify(layout));

          if (!(threadBox.x > chatBox.x && chatBox.x > previewBox.x)) {
            throw new Error("Columns are not ordered right-to-left: threads / chat / preview");
          }
          if (!layout.composerVisible || !layout.composerVisibleAfterNew) {
            throw new Error("Composer is not continuously visible");
          }
          if (!layout.pageFitsViewport) {
            throw new Error("Desktop layout requires page scrolling");
          }
          if (errors.length) {
            throw new Error("Browser errors detected: " + errors.join(" | "));
          }

          await page.screenshot({ path: "manager-chat-ui.png", fullPage: true });
          await browser.close();
          NODE

          node e2e.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-chat-ui
          path: manager-chat-ui.png
          if-no-files-found: ignore
          retention-days: 2
