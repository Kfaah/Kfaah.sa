name: Kfaah Live Schema Diff Audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.user.login == 'gaberalhrese-cloud' &&
      github.event.comment.body == 'KFAAH_SCHEMA_DIFF_AUDIT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare generated schema with live PostgREST
        env:
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY' > /tmp/schema-audit.txt
          import json, re, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          text = Path("src/integrations/supabase/types.ts").read_text(encoding="utf-8")
          lines = text.splitlines()
          tables = {}
          in_tables = False
          current = None
          in_row = False

          for line in lines:
              if line == "    Tables: {":
                  in_tables = True
                  continue
              if in_tables and line.startswith("    Views:"):
                  break
              if not in_tables:
                  continue

              m = re.match(r"^      ([A-Za-z0-9_]+): \{$", line)
              if m and not in_row:
                  current = m.group(1)
                  tables[current] = []
                  continue
              if current and line == "        Row: {":
                  in_row = True
                  continue
              if current and in_row and line == "        }":
                  in_row = False
                  continue
              if current and in_row:
                  m = re.match(r"^          ([A-Za-z0-9_]+):", line)
                  if m:
                      tables[current].append(m.group(1))

          base = "https://kfaah.sa/rest/v1/"
          headers = {
              "apikey": __import__("os").environ["ANON_KEY"],
              "Authorization": "Bearer " + __import__("os").environ["ANON_KEY"],
              "Accept": "application/json",
              "Range": "0-0",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read(4096).decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(4096).decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)

          missing_tables = []
          missing_cols = []
          unreadable = []
          other_errors = []
          ok_tables = 0
          tested_cols = 0

          for table, cols in tables.items():
              probe_col = cols[0] if cols else "*"
              q = urllib.parse.urlencode({"select": probe_col, "limit": "0"})
              status, body = get(base + urllib.parse.quote(table) + "?" + q)
              if status == 404 and ("PGRST205" in body or "Could not find the table" in body):
                  missing_tables.append(table)
                  continue
              if status in (401, 403):
                  unreadable.append((table, status, body.replace("\n"," ")[:180]))
                  continue
              if status not in (200, 206):
                  other_errors.append((table, status, body.replace("\n"," ")[:180]))
                  continue

              ok_tables += 1
              for col in cols:
                  tested_cols += 1
                  q = urllib.parse.urlencode({"select": col, "limit": "0"})
                  cs, cb = get(base + urllib.parse.quote(table) + "?" + q)
                  if cs == 400 and ("PGRST204" in cb or "Could not find" in cb and "column" in cb.lower()):
                      missing_cols.append((table, col, cb.replace("\n"," ")[:220]))
                  elif cs in (401,403):
                      # Table exists but individual-column visibility cannot be confirmed.
                      pass
                  elif cs not in (200,206):
                      other_errors.append((f"{table}.{col}", cs, cb.replace("\n"," ")[:180]))

          print("KFAAH LIVE SCHEMA DIFF")
          print(f"EXPECTED_TABLES={len(tables)}")
          print(f"READABLE_TABLES={ok_tables}")
          print(f"TESTED_COLUMNS={tested_cols}")
          print(f"MISSING_TABLES={len(missing_tables)}")
          for x in missing_tables:
              print("MISSING_TABLE|" + x)
          print(f"MISSING_COLUMNS={len(missing_cols)}")
          for t,c,b in missing_cols:
              print(f"MISSING_COLUMN|{t}|{c}|{b}")
          print(f"UNREADABLE_TABLES={len(unreadable)}")
          for t,s,b in unreadable[:80]:
              print(f"UNREADABLE|{t}|{s}|{b}")
          print(f"OTHER_ERRORS={len(other_errors)}")
          for t,s,b in other_errors[:120]:
              print(f"ERROR|{t}|{s}|{b}")
          PY

      - name: Post audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'KFAAH_SCHEMA_DIFF_AUDIT_REPORT'; echo; cat /tmp/schema-audit.txt; } > /tmp/comment.txt
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.txt
