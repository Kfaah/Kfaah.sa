name: Probe Kfaah manager worker host
# health-check-v3

on:
  push:
    branches:
      - kfaah-manager-worker-setup

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Hetzner capabilities
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" '
            set -eu
            echo "=== identity ==="
            id
            echo "=== home ==="
            pwd
            echo "=== node ==="
            command -v node || true
            node --version || true
            echo "=== npm ==="
            command -v npm || true
            npm --version || true
            echo "=== python ==="
            command -v python3 || true
            python3 --version || true
            echo "=== processes ==="
            ps -eo user,pid,ppid,cmd --sort=pid | grep -E "nginx|uvicorn|gunicorn|python|node|8891|9001|8000" | grep -v grep || true
            echo "=== proc cwd for listeners ==="
            for p in $(ss -ltnp 2>/dev/null | grep -E ":8000|:8891|:9001" | sed -n "s/.*pid=\([0-9][0-9]*\).*/\1/p" | sort -u); do
              echo "PID=$p"
              readlink -f "/proc/$p/cwd" 2>/dev/null || true
              tr "\\0" " " < "/proc/$p/cmdline" 2>/dev/null || true
              echo
            done
            echo "=== nginx readable config ==="
            grep -R "proxy_pass\|server_name\|location" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -120 || true
            echo "=== browser ==="
            command -v chromium || true
            command -v chromium-browser || true
            command -v google-chrome || true
            command -v google-chrome-stable || true
            echo "=== curl/wget/openssl/cron ==="
            command -v curl || true
            command -v wget || true
            command -v openssl || true
            command -v crontab || true
            echo "=== kfaah functions ==="
            ls -la /opt/kfaah/functions 2>&1 || true
            find /opt/kfaah/functions -maxdepth 2 -type f -printf "%M %u:%g %p\n" 2>/dev/null | head -120 || true
            echo "=== function app routes ==="
            grep -nE "functions/v1|route|def |FastAPI|Flask|HTTPServer|BaseHTTPRequestHandler" /opt/kfaah/functions/app.py 2>/dev/null | head -200 || true
            echo "=== app head ==="
            sed -n "1,220p" /opt/kfaah/functions/app.py 2>/dev/null || true
            echo "=== fast worker ==="
            ps -ef | grep "kfaah-fast/worker.py" | grep -v grep || true
            echo "--- worker log ---"
            tail -80 /home/deploy/kfaah-fast/worker.log 2>/dev/null || true
            echo "--- tunnel log ---"
            tail -80 /home/deploy/kfaah-fast/cloudflared.log 2>/dev/null || true
            tunnel="$(grep -Eo "https://[a-z0-9-]+\\.trycloudflare\\.com" /home/deploy/kfaah-fast/cloudflared.log 2>/dev/null | tail -1 || true)"
            echo "TUNNEL=$tunnel"
            if [ -n "$tunnel" ]; then
              echo "--- tunnel curl ---"
              curl -sS -D - "$tunnel/" -o /tmp/tunnel-body.txt || true
              head -30 /tmp/tunnel-body.txt || true
            fi
            echo "=== sudo ==="
            sudo -n -l 2>&1 || true
            echo "=== linger ==="
            loginctl show-user "$USER" -p Linger 2>&1 || true
            echo "=== user systemd ==="
            systemctl --user is-system-running 2>&1 || true
            echo "=== listening ==="
            ss -ltn | head -50 || true
            echo "=== dirs ==="
            ls -ld /var/www/kfaah /var/www/kfaah-staging /home/deploy 2>&1 || true
          '
