name: Kfaah Manager UI E2E

on:
  workflow_dispatch:
    inputs:
      session_cookie:
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Mask session
        run: echo "::add-mask::${{ inputs.session_cookie }}"

      - name: Test published manager UI
        env:
          SESSION_COOKIE: ${{ inputs.session_cookie }}
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

          cat > manager-ui-e2e.mjs <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          await context.addCookies([{
            name: "floot_built_app_session",
            value: process.env.SESSION_COOKIE,
            domain: "kfaah-manager.floot.app",
            path: "/",
            secure: true,
            httpOnly: true,
            sameSite: "Lax",
          }]);

          const page = await context.newPage();
          page.on("console", msg => console.log("MANAGER_CONSOLE", msg.type(), msg.text()));
          page.on("pageerror", err => console.log("MANAGER_PAGE_ERROR", err.message));
          page.on("requestfailed", req => console.log("MANAGER_REQUEST_FAILED", req.url(), req.failure()?.errorText || ""));

          await page.goto("https://kfaah-manager.floot.app/", {
            waitUntil: "domcontentloaded",
            timeout: 45000,
          });
          await page.getByRole("heading", { name: "منصة كفاءة" }).waitFor({ timeout: 30000 });
          await page.waitForTimeout(5000);

          const spinner = await page.getByText("جارٍ تجهيز المعاينة...").count();
          const oldError = await page.getByText(/Unexpected inputs provided/).count();
          const publishedLabel = await page.getByText("منشور على الموقع الحي").count();
          const iframe = page.locator('iframe[title*="المعاينة"]');
          const iframeCount = await iframe.count();

          console.log("MANAGER_STATE", JSON.stringify({
            url: page.url(),
            spinner,
            oldError,
            publishedLabel,
            iframeCount,
          }));

          if (spinner > 0) throw new Error("Preview spinner is still visible");
          if (oldError > 0) throw new Error("Old Unexpected inputs error is visible");
          if (publishedLabel === 0) throw new Error("Published state label is missing");
          if (iframeCount === 0) throw new Error("Preview iframe is missing");

          const handle = await iframe.first().elementHandle();
          const frame = await handle?.contentFrame();
          if (!frame) throw new Error("Could not access preview frame");

          await frame.waitForLoadState("domcontentloaded", { timeout: 30000 }).catch(() => {});
          await frame.waitForTimeout(5000);
          const bodyText = await frame.locator("body").innerText().catch(() => "");
          console.log("PREVIEW_BODY", JSON.stringify(bodyText.slice(0, 1500)));

          if (!bodyText.includes("دخول مدير النظام")) {
            throw new Error("Preview frame did not render the system-manager login page");
          }

          await page.screenshot({ path: "manager-ui-e2e.png", fullPage: true });
          await browser.close();
          NODE

          node manager-ui-e2e.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-ui-e2e
          path: manager-ui-e2e.png
          if-no-files-found: ignore
          retention-days: 2
