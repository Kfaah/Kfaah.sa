name: Kfaah owner stage only
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: >-
      github.repository == 'Kfaah/Kfaah.sa' &&
      github.ref == 'refs/heads/main' && github.actor_id == '341028123' &&
      github.event.issue.user.id == 341028123 &&
      github.event.issue.title == 'KFAAH_OWNER_STAGE_ONLY_V1' &&
      !github.event.issue.pull_request && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: stage-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: build-tools
          persist-credentials: false
      - name: Validate owner request without server access
        run: |
          set -euo pipefail
          python3 -B stage-tools/deploy/frontend-interface/stage_only.py plan \
            --tools build-tools/deploy/frontend-interface \
            --audit-workflow unused
          echo 'EXECUTION_BLOCKED_PENDING_INDEPENDENT_APPROVAL; QUIET_WINDOW_IS_AN_ASSERTION'
  stage:
    environment: kfaah-stage
    concurrency:
      group: kfaah-frontend-deploy
      cancel-in-progress: false
    needs: review
    # Hard lock: separate reviewed activation is required.
    if: ${{ false && needs.review.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WORKFLOW_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      KFAAH_LEGACY_READ_TOKEN: ${{ secrets.KFAAH_LEGACY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: stage-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: build-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: audit-tools
          persist-credentials: false
      - name: Validate exact owner request
        id: plan
        run: |
          set -euo pipefail
          python3 -B stage-tools/deploy/frontend-interface/stage_only.py plan \
            --tools build-tools/deploy/frontend-interface \
            --audit-workflow audit-tools/.github/workflows/kfaah-owner-baseline-preflight.yml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.plan.outputs.build_run_id }}
          artifact-ids: ${{ steps.plan.outputs.artifact_id }}
          merge-multiple: true
          path: sealed-bundle
      - name: Verify exact artifact provenance and bytes without rebuilding
        run: |
          set -euo pipefail
          python3 -B stage-tools/deploy/frontend-interface/stage_only.py verify \
            --tools build-tools/deploy/frontend-interface \
            --audit-workflow audit-tools/.github/workflows/kfaah-owner-baseline-preflight.yml
      - name: Back up verified historical frontend locally then receive candidate only
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HETZNER_SSH_KEY:?Missing existing deploy key}"
          : "${HETZNER_KNOWN_HOSTS:?Missing existing pinned host keys}"
          stage_key_dir="$(mktemp -d "$RUNNER_TEMP/kfaah-stage-only.XXXXXX")"
          trap 'rm -rf -- "$stage_key_dir"' EXIT
          chmod 700 "$stage_key_dir"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$stage_key_dir/key"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$stage_key_dir/known_hosts"
          chmod 600 "$stage_key_dir/key" "$stage_key_dir/known_hosts"
          export STAGE_KEY_DIR="$stage_key_dir"
          python3 -B stage-tools/deploy/frontend-interface/stage_only.py backup \
            --tools build-tools/deploy/frontend-interface \
            --audit-workflow audit-tools/.github/workflows/kfaah-owner-baseline-preflight.yml
          python3 -B stage-tools/deploy/frontend-interface/stage_only.py stage \
            --tools build-tools/deploy/frontend-interface \
            --audit-workflow audit-tools/.github/workflows/kfaah-owner-baseline-preflight.yml
      - name: Display allowlisted stage evidence only
        if: always()
        run: |
          python3 -B stage-tools/deploy/frontend-interface/stage_only.py evidence \
            --tools build-tools/deploy/frontend-interface \
            --audit-workflow audit-tools/.github/workflows/kfaah-owner-baseline-preflight.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kfaah-stage-only-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage-evidence/
          if-no-files-found: warn
          retention-days: 14
