name: Repair MyPerformance Fast Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/id_kfaah_deploy"
          chmod 600 "$HOME/.ssh/id_kfaah_deploy"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync fixed baseline and patch active workspace
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          test "$HETZNER_USER" = deploy

          rsync -az -e "ssh -i $HOME/.ssh/id_kfaah_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"             src/pages/MyPerformance.tsx             "$HETZNER_USER@$HETZNER_HOST:/home/deploy/kfaah-fast/baseline/src/pages/MyPerformance.tsx"

          ssh -i "$HOME/.ssh/id_kfaah_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$HETZNER_USER@$HETZNER_HOST" 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          p = Path("/home/deploy/kfaah-fast/workspace/src/pages/MyPerformance.tsx")
          s = p.read_text(encoding="utf-8")
          if 'usePreviewMode' not in s:
              s = s.replace(
                  'import { useAuth } from "@/hooks/useAuth";',
                  'import { useAuth } from "@/hooks/useAuth";\nimport { usePreviewMode } from "@/contexts/PreviewModeContext";'
              )
              s = s.replace(
                  'export default function MyPerformance() {\n  const { user } = useAuth();',
                  'export default function MyPerformance() {\n  const { user } = useAuth();\n  const { isPreviewMode } = usePreviewMode();'
              )
              s = s.replace(
                  '  useEffect(() => {\n    if (!user) return;\n    (async () => {',
                  '  useEffect(() => {\n    if (isPreviewMode) {\n      setEmployee({ full_name: "معاينة", job_role: "وضع المعاينة" });\n      setLoading(false);\n      return;\n    }\n    if (!user) return;\n    (async () => {'
              )
              s = s.replace('  }, [user]);', '  }, [user, isPreviewMode]);')
          p.write_text(s, encoding="utf-8")
          PY'

      - name: Browser-check current fast preview
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > check.mjs <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          page.on("pageerror", e => console.log("PAGE_ERROR", e.message));
          await page.goto("https://relatives-nicholas-closure-sustainability.trycloudflare.com/my-performance?preview=true", {
            waitUntil: "domcontentloaded",
            timeout: 45000,
          });
          await page.waitForTimeout(3500);
          const body = await page.locator("body").innerText();
          console.log("BODY", JSON.stringify(body.slice(0, 2200)));
          if (!body.includes("أدائي")) throw new Error("MyPerformance did not render");
          if (!body.includes("الأداء الواقعي")) throw new Error("Requested text change is not visible");
          if (body.includes("جارٍ")) console.log("NOTE: body contains Arabic loading text elsewhere");
          await page.screenshot({ path: "my-performance-preview.png", fullPage: true });
          await browser.close();
          NODE
          node check.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-performance-preview-check
          path: my-performance-preview.png
          if-no-files-found: ignore
          retention-days: 2
