name: Kfaah Edge Functions Boot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kfaah-edge-functions-boot.yml'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Resolve local API credentials safely
        run: |
          supabase status -o env > /tmp/supabase-local.env
          chmod 600 /tmp/supabase-local.env
          set -a
          . /tmp/supabase-local.env
          set +a
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          printf 'API_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'ANON_KEY=%s\n' "$ANON_KEY" >> "$GITHUB_ENV"
          printf 'SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Inventory functions invoked by the frontend
        run: |
          python3 - <<'PY' > /tmp/kfaah-functions.txt
          from pathlib import Path
          import re
          found=set()
          rx=re.compile(r'functions\s*\.\s*invoke\(\s*["\']([^"\']+)["\']', re.S)
          for p in list(Path("src").rglob("*.ts")) + list(Path("src").rglob("*.tsx")):
              found.update(rx.findall(p.read_text(encoding="utf-8", errors="replace")))
          for name in sorted(found):
              print(name)
          PY
          test -s /tmp/kfaah-functions.txt
          echo "frontend_functions=$(wc -l < /tmp/kfaah-functions.txt)"

      - name: Boot every frontend Edge Function
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r fn; do
            code="$(curl --connect-timeout 5 --max-time 30 -sS               -o /tmp/kfaah-function-body               -w '%{http_code}'               -X OPTIONS               -H "apikey: $ANON_KEY"               -H "Authorization: Bearer $ANON_KEY"               -H 'Origin: http://127.0.0.1'               -H 'Access-Control-Request-Method: POST'               -H 'Access-Control-Request-Headers: authorization,apikey,content-type'               "$API_URL/functions/v1/$fn" || true)"
            bytes="$(wc -c < /tmp/kfaah-function-body 2>/dev/null || echo 0)"
            echo "$fn|HTTP=$code|bytes=$bytes"
            if [[ "$code" == "000" || "$code" -ge 500 ]]; then
              echo "BOOT_FAILURE|$fn|HTTP=$code"
              head -c 500 /tmp/kfaah-function-body || true
              echo
              failed=1
            fi
          done < /tmp/kfaah-functions.txt
          [[ "$failed" -eq 0 ]] || exit 1

      - name: End-to-end demo authentication on native Edge Runtime
        run: |
          set -euo pipefail

          demo_json="$(curl --fail-with-body -sS \
            -X POST "$API_URL/functions/v1/setup-demo" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{}')"

          email="$(printf '%s' "$demo_json" | jq -r '.email // empty')"
          password="$(printf '%s' "$demo_json" | jq -r '.password // empty')"
          test -n "$email"
          test -n "$password"
          echo "::add-mask::$email"
          echo "::add-mask::$password"

          login_json="$(curl --fail-with-body -sS \
            -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')")"

          token="$(printf '%s' "$login_json" | jq -r '.access_token // empty')"
          uid="$(printf '%s' "$login_json" | jq -r '.user.id // empty')"
          test -n "$token"
          test -n "$uid"
          echo "::add-mask::$token"

          membership="$(curl --fail-with-body -sS \
            "$API_URL/rest/v1/user_organizations?select=organization_id,approval_status&user_id=eq.$uid&organization_id=eq.00000000-0000-0000-0000-0000000000de" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $token")"

          test "$(printf '%s' "$membership" | jq 'length')" -ge 1
          test "$(printf '%s' "$membership" | jq -r '.[0].approval_status')" = "approved"
          echo "NATIVE_SETUP_DEMO_LOGIN_OK"

      - name: End-to-end organization-scoped employee authorization
        run: |
          set -euo pipefail

          DEMO_ORG="00000000-0000-0000-0000-0000000000de"
          OTHER_ORG="00000000-0000-0000-0000-0000000000e2"
          CALLER_EMAIL="kfaah-admin-${GITHUB_RUN_ID}@test.local"
          TARGET_EMAIL="kfaah-cross-org-${GITHUB_RUN_ID}@test.local"
          CALLER_PASSWORD="Qa9!KfaahAdmin${GITHUB_RUN_NUMBER}"
          TARGET_PASSWORD="Qa9!KfaahTarget${GITHUB_RUN_NUMBER}"
          EMPLOYEE_PASSWORD="Qa9!KfaahEmployee${GITHUB_RUN_NUMBER}"

          for secret in "$CALLER_EMAIL" "$TARGET_EMAIL" "$CALLER_PASSWORD" "$TARGET_PASSWORD" "$EMPLOYEE_PASSWORD"; do
            echo "::add-mask::$secret"
          done

          admin_user() {
            local email="$1"
            local password="$2"
            curl --fail-with-body -sS \
              -X POST "$API_URL/auth/v1/admin/users" \
              -H "apikey: $SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg e "$email" --arg p "$password"                 '{email:$e,password:$p,email_confirm:true}')"
          }

          rest_post() {
            local table="$1"
            local payload="$2"
            curl --fail-with-body -sS \
              -X POST "$API_URL/rest/v1/$table" \
              -H "apikey: $SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: return=representation' \
              --data "$payload"
          }

          caller_json="$(admin_user "$CALLER_EMAIL" "$CALLER_PASSWORD")"
          CALLER_ID="$(printf '%s' "$caller_json" | jq -r '.id // empty')"
          test -n "$CALLER_ID"
          echo "::add-mask::$CALLER_ID"

          rest_post user_organizations "$(jq -n             --arg uid "$CALLER_ID" --arg org "$DEMO_ORG"             '{user_id:$uid,organization_id:$org,is_default:true,approval_status:"approved"}')" >/tmp/caller-membership.json

          rest_post employees "$(jq -n             --arg uid "$CALLER_ID" --arg org "$DEMO_ORG" --arg email "$CALLER_EMAIL"             '{user_id:$uid,organization_id:$org,full_name:"CI Org Admin",username:"9900000001",email:$email,phone:"0500000001",job_role:"مدير جمعية",role_color:"bg-primary",status:"active",role_level:"admin"}')" >/tmp/caller-employee.json

          rest_post user_roles "$(jq -n             --arg uid "$CALLER_ID" --arg org "$DEMO_ORG"             '{user_id:$uid,role:"admin",organization_id:$org}')" >/tmp/caller-role.json

          login_json="$(curl --fail-with-body -sS             -X POST "$API_URL/auth/v1/token?grant_type=password"             -H "apikey: $ANON_KEY"             -H "Content-Type: application/json"             --data "$(jq -n --arg e "$CALLER_EMAIL" --arg p "$CALLER_PASSWORD" '{email:$e,password:$p}')")"
          CALLER_TOKEN="$(printf '%s' "$login_json" | jq -r '.access_token // empty')"
          test -n "$CALLER_TOKEN"
          echo "::add-mask::$CALLER_TOKEN"

          create_response="$(curl --fail-with-body -sS             -X POST "$API_URL/functions/v1/create-employee"             -H "apikey: $ANON_KEY"             -H "Authorization: Bearer $CALLER_TOKEN"             -H 'Content-Type: application/json'             --data "$(jq -n               --arg org "$DEMO_ORG" --arg pass "$EMPLOYEE_PASSWORD"               '{organizationId:$org,fullName:"CI Created Employee",username:"9900000002",password:$pass,email:"created-employee@test.local",phone:"0500000002",jobRole:"موظف",roleLevel:"employee"}')")"

          test "$(printf '%s' "$create_response" | jq -r '.success')" = "true"
          CREATED_USER_ID="$(printf '%s' "$create_response" | jq -r '.employee.user_id // empty')"
          test -n "$CREATED_USER_ID"
          echo "::add-mask::$CREATED_USER_ID"

          created_membership="$(curl --fail-with-body -sS             "$API_URL/rest/v1/user_organizations?select=organization_id,approval_status&user_id=eq.$CREATED_USER_ID&organization_id=eq.$DEMO_ORG"             -H "apikey: $SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SERVICE_ROLE_KEY")"
          test "$(printf '%s' "$created_membership" | jq 'length')" -eq 1
          test "$(printf '%s' "$created_membership" | jq -r '.[0].approval_status')" = "approved"

          rest_post organizations "$(jq -n --arg id "$OTHER_ORG"             '{id:$id,name:"CI Other Organization",slug:"ci-other-org",is_active:true}')" >/tmp/other-org.json

          target_json="$(admin_user "$TARGET_EMAIL" "$TARGET_PASSWORD")"
          TARGET_ID="$(printf '%s' "$target_json" | jq -r '.id // empty')"
          test -n "$TARGET_ID"
          echo "::add-mask::$TARGET_ID"

          rest_post user_organizations "$(jq -n             --arg uid "$TARGET_ID" --arg org "$OTHER_ORG"             '{user_id:$uid,organization_id:$org,is_default:true,approval_status:"approved"}')" >/tmp/target-membership.json

          rest_post employees "$(jq -n             --arg uid "$TARGET_ID" --arg org "$OTHER_ORG" --arg email "$TARGET_EMAIL"             '{user_id:$uid,organization_id:$org,full_name:"CI Other Employee",username:"9900000003",email:$email,phone:"0500000003",job_role:"موظف",role_color:"bg-primary",status:"active",role_level:"employee"}')" >/tmp/target-employee.json

          cross_code="$(curl -sS -o /tmp/cross-org.out -w '%{http_code}'             -X POST "$API_URL/functions/v1/create-employee"             -H "apikey: $ANON_KEY"             -H "Authorization: Bearer $CALLER_TOKEN"             -H 'Content-Type: application/json'             --data "$(jq -n --arg uid "$TARGET_ID"               '{action:"sync-login",userId:$uid,username:"9900000099"}')")"
          test "$cross_code" = "403"

          cross_create_code="$(curl -sS -o /tmp/cross-create.out -w '%{http_code}'             -X POST "$API_URL/functions/v1/create-employee"             -H "apikey: $ANON_KEY"             -H "Authorization: Bearer $CALLER_TOKEN"             -H 'Content-Type: application/json'             --data "$(jq -n --arg org "$OTHER_ORG" --arg pass "$EMPLOYEE_PASSWORD"               '{organizationId:$org,fullName:"Forbidden Cross Org",username:"9900000004",password:$pass,email:"forbidden@test.local",phone:"0500000004",jobRole:"موظف",roleLevel:"employee"}')")"
          test "$cross_create_code" = "403"

          echo "NATIVE_CREATE_EMPLOYEE_ORG_SCOPE_OK"
          echo "NATIVE_CROSS_ORG_ACCOUNT_MUTATION_BLOCKED"

      - name: Static authorization contract audit
        run: python3 scripts/recovery/audit_edge_function_auth.py

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
